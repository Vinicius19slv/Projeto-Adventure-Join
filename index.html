// (o outro comando fica com o valor antigo — nunca vira config ambígua).
function applyRemap(cmd, value){
    const table = (remapMode === 'gamepad') ? gamepadBindings : keyBindings;
    if(remapMode === 'keyboard' && value === 'Escape') return;
    const prev = table[cmd];
    const other = Object.keys(table).find(k => k !== cmd && table[k] === value);
    table[cmd] = value;
    const shown = (remapMode === 'gamepad') ? padLabel(value) : keyLabel(value);
    if(other){
        table[other] = prev;
        remapMsg = 'Conflito: ' + cmdLabel(cmd) + ' e ' + cmdLabel(other) + ' trocados.';
    } else {
        remapMsg = cmdLabel(cmd) + '  →  ' + shown;
    }
    saveBindings();
}
function resetBindings(){
    if(remapMode === 'gamepad') Object.assign(gamepadBindings, DEFAULT_GAMEPAD_BINDINGS);
    else                        Object.assign(keyBindings,     DEFAULT_KEY_BINDINGS);
    remapCapturing = null;
    remapMsg = 'Padrão restaurado.';
    saveBindings();
}
// Captura de botão do gamepad enquanto a tela de personalização espera input.
// Só vincula numa transição solto→pressionado DEPOIS que a captura começou —
// o primeiro frame apenas fotografa o estado atual (evita vincular um botão
// que já estava segurado ou com ruído/drift).
function pollRemapGamepad(){
    if(!navigator.getGamepads) return;
    const gp = Array.from(navigator.getGamepads()).find(p => p);
    if(!gp) return;
    const priming = (remapPadPrev.length === 0);
    for(let i = 0; i < gp.buttons.length; i++){
        const down = !!(gp.buttons[i] && (gp.buttons[i].pressed || gp.buttons[i].value > 0.5));
        if(!priming && down && !remapPadPrev[i] && remapCapturing){
            applyRemap(remapCapturing, i);
            remapCapturing = null;
        }
        remapPadPrev[i] = down;
    }
}

let equippedWeapon = null;                    // arma "ativa" = último slot de arma usado (combate/desenho consultam)
let pauseView = 'pause';                      // 'pause' | 'inventory'
let invSel = 0;                               // índice na lista achatada de itens possuídos

// Lista achatada dos equipamentos possuídos (armas primeiro), p/ navegação do inventário.
function flatOwned(){
    const owned = ownedEquipment();
    return [
        ...owned.filter(isWeaponCat),
        ...owned.filter(e=>!isWeaponCat(e))
    ];
}
function currentInvEntry(){
    const f = flatOwned();
    if(f.length===0) return null;
    return f[Math.max(0, Math.min(f.length-1, invSel))];
}
function getEquippedWeapon(){
    const e = equipmentById(equippedWeapon);
    return (e && e.type==='weapon' && e.owned()) ? e : null;
}
function weaponEquipped(){ return !!getEquippedWeapon(); }

// ── ATRIBUIÇÃO DE SLOTS ────────────────────────────────────
// Um mesmo item nunca fica em dois slots: ao pôr num slot, sai dos outros.
function assignToSlot(id, slot){
    if(!EQUIPMENT[id] || SLOT_NAMES.indexOf(slot)===-1) return;
    for(const s of SLOT_NAMES) if(equipmentSlots[s]===id) equipmentSlots[s] = null;
    equipmentSlots[slot] = id;
    const eq = EQUIPMENT[id];
    if(eq.type==='weapon' && !getEquippedWeapon()) equippedWeapon = id;
    renderSlotHud();
}
// Ao COLETAR um equipamento: cai no slot natural se ele estiver livre (ou com
// item que o jogador não possui mais); senão fica para atribuição manual.
function autoPlaceEquipment(id){
    if(!EQUIPMENT[id] || !EQUIPMENT[id].owned()) return false;
    if(SLOT_NAMES.some(s=>equipmentSlots[s]===id)) return true;   // já está num slot
    const slot = DEFAULT_SLOT[id];
    if(!slot) return false;
    const occ = equipmentById(equipmentSlots[slot]);
    if(!equipmentSlots[slot] || (occ && !occ.owned())){
        assignToSlot(id, slot);
        return true;
    }
    return false;
}

/* ═══════════════════════════════════════════════════════════════════════════
   INPUT MANAGER → COMMAND SYSTEM (V28)
   ───────────────────────────────────────────────────────────────────────────
   Teclado, Gamepad e Touch convergem aqui. Nenhuma fonte de entrada conhece
   "ataque" ou "defesa": elas só disparam NOMES DE COMANDO
   (slotTop/slotLeft/slotBottom/slotRight/roll). O comando resolve qual
   equipamento está no slot e delega para o sistema de gameplay que já existe.

        tecla/botão  →  comando (slotX / roll)  →  equipamento no slot  →  ação
   ═══════════════════════════════════════════════════════════════════════════ */
const SLOT_CMDS = ['slotTop','slotLeft','slotBottom','slotRight'];
let blockHeld = false;          // defesa unificada (qualquer fonte de entrada)
let blockHeldSlot = null;       // qual slot está segurando a defesa

function commandForKey(code){
    for(const c of SLOT_CMDS) if(keyBindings[c] === code) return c;
    if(keyBindings.roll === code) return 'roll';
    return null;
}
function slotOfCommand(cmd){ return cmd.slice(4).toLowerCase(); }   // 'slotTop' → 'top'

// COMMAND SYSTEM — recebe (comando, fase). fase: 'press' | 'release'.
function useCommand(cmd, phase){
    if(screen!=='game' || paused || gameOver || dialog.active) return;
    // V34: mãos ocupadas — qualquer slot arremessa; roll fica bloqueado
    if(player.carrying){ if(phase === 'press' && cmd !== 'roll') throwCarried(); return; }
    if(cmd === 'roll'){ if(phase === 'press') doRoll(); return; }      // reusa doRoll() intacto
    if(SLOT_CMDS.indexOf(cmd) !== -1) useEquipmentSlot(slotOfCommand(cmd), phase);
}

// EQUIPMENT SYSTEM — a ação do slot depende SÓ do equipamento equipado nele.
function useEquipmentSlot(slot, phase){
    const eq = equipmentById(equipmentSlots[slot]);
    if(!eq || !eq.owned()){
        if(phase === 'release' && blockHeldSlot === slot){ blockHeld = false; blockHeldSlot = null; }
        return;
    }
    switch(eq.action){
        case 'attack':
        case 'boomerang':
            // fluxo unificado da arma (leve/pesado/bumerangue) — reutilizado
            if(phase === 'press'){ equippedWeapon = eq.id; pulseSlot(slot); startAttackInput(); }
            else                 { equippedWeapon = eq.id; releaseAttackInput(); }
            break;
        case 'defend':
            // bloqueio direcional (V33): gameLoop lê blockHeld
            if(phase === 'press'){ blockHeld = true;  blockHeldSlot = slot; setSlotActive(slot, true); }
            else                 { blockHeld = false; blockHeldSlot = null; setSlotActive(slot, false); }
            break;
        case 'heal':
            if(phase === 'press'){ pulseSlot(slot); useConsumable(getPotion(eq.id)); }   // cura pelo sistema de vida
            break;
        case 'bomb':
            if(phase === 'press'){ pulseSlot(slot); placeBomb(); }
            break;
        case 'bow':
            if(phase === 'press'){ pulseSlot(slot); fireArrow(); }
            break;
    }
}

// ── HUD DOS 4 SLOTS (losango) — desenho e destaque ─────────
function slotEls(slot){
    return ['#slot-hud', '#slot-pad']
        .map(h => document.querySelector(h + ' [data-slot="' + slot + '"]'))
        .filter(Boolean);
}
function setSlotActive(slot, on){
    slotEls(slot).forEach(el => { el.classList.toggle('active', on); el.classList.toggle('active-btn', on); });
}
function pulseSlot(slot){               // destaque discreto e passageiro do slot usado (§15)
    slotEls(slot).forEach(el => {
        el.classList.add('active'); el.classList.add('active-btn');
        clearTimeout(el._pulseT);
        el._pulseT = setTimeout(() => { el.classList.remove('active'); el.classList.remove('active-btn'); }, 200);
    });
}
function renderSlotHud(){
    for(const slot of SLOT_NAMES){
        const eq = equipmentById(equipmentSlots[slot]);
        const owned = !!(eq && eq.owned());
        slotEls(slot).forEach(el => {
            el.classList.toggle('empty', !owned);
            if(!owned){ el.textContent = ''; return; }
            const src = eq.asset ? ASSETS[eq.asset] : null;   // arte real do item, se existir
            if(src){
                el.innerHTML = '<img alt="' + eq.name + '">';
                const img = el.firstElementChild;
                img.onerror = () => { el.textContent = eq.icon; };   // sem arquivo → emoji
                img.src = src;
            } else {
                el.textContent = eq.icon;                            // fallback: ícone/emoji, fundo transparente
            }
        });
    }
    const badge = document.getElementById('gp-badge');
    if(badge) badge.classList.toggle('on', !!gamepadActive);
}

/* ── GAMEPAD (USB / Bluetooth) — Gamepad API do navegador ──────────────────
   Detecta controle conectado, lê botões/analógicos/triggers e converte tudo
   nos MESMOS comandos do teclado/touch. Mapeamento configurável em
   gamepadBindings; movimento pelo analógico esquerdo é fonte ADICIONAL
   (não substitui WASD / setas / joystick virtual). */
let gamepadActive = false;
let gpSprintHeld  = false;
window.addEventListener('gamepadconnected', e => {
    gamepadActive = true;
    showToast('CONTROLADOR DETECTADO: ' + (e.gamepad && e.gamepad.id ? e.gamepad.id : 'gamepad'));
    renderSlotHud();
});
window.addEventListener('gamepaddisconnected', () => {
    const pads = navigator.getGamepads ? Array.from(navigator.getGamepads()).filter(Boolean) : [];
    gamepadActive = pads.length > 0;
    renderSlotHud();
});
const Gamepad = (() => {
    const prev = {};
    const move = { x:0, y:0 };
    let reprime = false;   // V29: após voltar de um menu, ignora 1 leitura p/ não
                           //      "vazar" o A/START ainda pressionado como ação no jogo
    function btnDown(gp, i){ const b = gp.buttons[i]; return !!(b && (b.pressed || b.value > 0.5)); }
    function poll(){
        move.x = 0; move.y = 0; gpSprintHeld = false;
        if(!navigator.getGamepads) return move;
        const gp = Array.from(navigator.getGamepads()).find(p => p);
        if(!gp){ return move; }
        if(!gamepadActive){ gamepadActive = true; renderSlotHud(); }

        if(reprime){
            for(const c of [...SLOT_CMDS, 'roll', 'jump']) prev[c] = btnDown(gp, gamepadBindings[c]);
            prev._padInteract = false;
            reprime = false;
            gpSprintHeld = btnDown(gp, gamepadBindings.sprint);
            return move;   // 1 frame sem despachar nada
        }

        if(screen === 'game' && !paused){
            if(dialog.active){
                // durante o diálogo, qualquer botão de ação avança a fala
                for(const c of [...SLOT_CMDS, 'roll', 'jump']){
                    const now = btnDown(gp, gamepadBindings[c]);
                    if(now && !prev[c]) advanceDialog();
                    prev[c] = now;
                }
            } else {
                for(const c of [...SLOT_CMDS, 'roll', 'jump']){
                    const now = btnDown(gp, gamepadBindings[c]);
                    if(now && !prev[c]){
                        if(c === 'jump'){ if(player.y === 0 && !player.rolling) player.velY = 13; }
                        // B / Slot Direito: confirma a interação contextual se houver alvo
                        else if(c === 'slotRight' && InteractionManager.hasTarget()){ prev._padInteract = true; InteractionManager.confirm(); }
                        else useCommand(c, 'press');
                    } else if(!now && prev[c] && c !== 'jump'){
                        if(c === 'slotRight' && prev._padInteract){ prev._padInteract = false; }
                        else useCommand(c, 'release');
                    }
                    prev[c] = now;
                }
            }
        }

        // analógico esquerdo → movimento, com deadzone central
        let ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
        if(Math.hypot(ax, ay) < GAMEPAD_DEADZONE){ ax = 0; ay = 0; }
        move.x = ax; move.y = ay;
        gpSprintHeld = btnDown(gp, gamepadBindings.sprint);
        return move;
    }
    return { poll, reprime(){ reprime = true; } };
})();

let gameOver = false;
let paused  = false;
let uiNavReady = false;   // V29: true depois que o UINav (moldura de foco) inicializa
let keys    = {};
let joyData = { id:null, x:0, y:0 };
let stamina = 100, lastTime = Date.now(), freezeFrames = 0;
let staminaUIAlpha = 0, rollFxTimer = 0;
let camera  = { x:0, y:0, zoom:0.75 };

const btns = {
    roll:   document.getElementById('btn-roll'),
    jump:   document.getElementById('btn-jump'),
    sprint: document.getElementById('btn-sprint'),
};
let interactKeyHeld = false;   // L consumido como "confirmar interação" neste toque

window.addEventListener('keydown', e => {
    keys[e.code] = true;
    // Tela de personalização de controles: captura de tecla / navegação
    if (screen === 'remap') {
        if (e.code === 'Escape') {
            if (remapCapturing) { remapCapturing = null; remapMsg = ''; }
            else screen = 'controls';
            return;
        }
        if (remapCapturing && remapMode === 'keyboard' && !e.repeat) {
            e.preventDefault();
            applyRemap(remapCapturing, e.code);
            remapCapturing = null;
        } else if (!remapCapturing && !e.repeat) {
            if (UINav.handleKey(e)) e.preventDefault();   // navegar linhas / abas / botões
        }
        return;   // nenhuma tecla "vaza" para o jogo enquanto se personaliza
    }
    // ESC: fecha mini-janela → sai do inventário → pause → jogo
    if ((e.code==='Escape' || e.key==='Escape') && !e.repeat) {
        if (screen==='game' && !gameOver) {
            if (!paused) pauseGame();
            else if (IAM.open) iamBack();
            else if (pauseView==='inventory') showPauseView('pause');
            else resumeGame();
        } else if (screen==='controls' || screen==='changelog') { screen='menu'; }
        return;
    }
    // Navegação por teclado dos MENUS desenhados no canvas (V29)
    if ((screen==='menu' || screen==='controls' || screen==='changelog') && !e.repeat) {
        if (UINav.handleKey(e)) e.preventDefault();
        return;
    }
    // Navegação do Pause / Inventário / mini-janela (só quando pausado) — V30
    // As setas NÃO trocam mais de tela: isso agora é só RB/LB. ← → ↑ ↓ navegam.
    if (screen==='game' && paused && !gameOver) {
        if (e.repeat) return;
        const tok = navToken(e);
        // Atalho I/J/K/L (e 1..4): põe o item selecionado num slot — só no grid,
        // nunca com a mini-janela aberta.
        if (pauseView==='inventory' && !IAM.open) {
            const slotKey = invSlotKeyOf(e);
            if (slotKey) { assignSelectedToSlot(slotKey); return; }
        }
        if (tok==='up')    { UINav.move(-1);  return; }
        if (tok==='down')  { UINav.move(1);   return; }
        if (tok==='left')  { UINav.horiz(-1); return; }
        if (tok==='right') { UINav.horiz(1);  return; }
        if (tok==='ok')    { UINav.activate(); return; }
        return;
    }
    // Tela de morte: navegação por teclado dos botões Recomeçar / Menu (V29)
    if (screen==='game' && gameOver) {
        if (!e.repeat && UINav.handleKey(e)) e.preventDefault();
        return;
    }
    if (screen !== 'game' || paused) return;
    // Diálogo aberto: sem tecla dedicada de interação — o Slot Direito (L),
    // Enter e Espaço avançam a fala. Nada de interação com o mundo aqui.
    if (dialog.active) {
        if (!e.repeat && (commandForKey(e.code)==='slotRight' || e.code==='Enter' || e.code==='NumpadEnter' || e.code==='Space')) advanceDialog();
        return;
    }
    // I/J/K/L não têm ação fixa: cada tecla "usa o slot" e o equipamento decide.
    if (!e.repeat) {
        const cmd = commandForKey(e.code);
        if (cmd) {
            // INTERAÇÃO CONTEXTUAL: se há algo interagível por perto, o Slot
            // Direito confirma a interação em vez de usar o equipamento.
            if (cmd === 'slotRight' && InteractionManager.hasTarget()) {
                interactKeyHeld = true;
                InteractionManager.confirm();
                return;
            }
            useCommand(cmd, 'press');
            return;
        }
        if (e.code===keyBindings.jump && player.y===0 && !player.rolling) player.velY = 13;
    }
    // Teclas de TESTE desta fase: concedem itens para experimentar as mecânicas
    if (!e.repeat && e.code==='Digit1') debugGrant('red');
    if (!e.repeat && e.code==='Digit2') debugGrant('blue');
    if (!e.repeat && e.code==='Digit3') debugGrant('green');
    if (!e.repeat && e.code==='Digit4') debugGrant('rboom');
    if (!e.repeat && e.code==='Digit5') debugGrant('mboom');
    if (!e.repeat && e.code==='Digit6') debugGrant('bomb');
    if (!e.repeat && e.code==='Digit7') debugGrant('bow');
    if (!e.repeat && e.code==='Digit8') debugGrant('arrows');
    if (!e.repeat && e.code==='Digit9') debugGrant('rupees');
});
window.addEventListener('keyup', e => {
    keys[e.code] = false;
    const cmd = commandForKey(e.code);
    if (cmd) {
        // se este L foi consumido como "confirmar interação", não solta o slot
        if (cmd === 'slotRight' && interactKeyHeld) { interactKeyHeld = false; return; }
        useCommand(cmd, 'release');
    }
});

// Mouse: o botão esquerdo aciona o SLOT DIREITO (ação primária, espada por
// padrão) — ou confirma a interação contextual quando há algo por perto.
window.addEventListener('mousedown', e => {
    if (e.button!==0) return;
    if (dialog.active) { advanceDialog(); return; }
    if (InteractionManager.hasTarget()) { interactKeyHeld = true; InteractionManager.confirm(); return; }
    useCommand('slotRight', 'press');
});
window.addEventListener('mouseup', e => {
    if (e.button!==0) return;
    if (interactKeyHeld) { interactKeyHeld = false; return; }
    useCommand('slotRight', 'release');
});
// Botão direito não inicia mais nada; só evitamos o menu do navegador durante o jogo.
window.addEventListener('contextmenu', e => { if (screen==='game') e.preventDefault(); });

let slotTouchDown = { top:false, left:false, bottom:false, right:false };
function touchInsideEl(el, touches, pad){
    if (!el) return false;
    const r = el.getBoundingClientRect();
    pad = pad || 12;
    for (let t of touches){
        if (t.clientX>r.left-pad && t.clientX<r.right+pad && t.clientY>r.top-pad && t.clientY<r.bottom+pad) return true;
    }
    return false;
}
function updateInputs(e) {
    if (screen !== 'game' || paused) return;
    e.preventDefault();
    Object.values(btns).forEach(b => b && b.classList.remove('active-btn'));
    for (let t of e.touches) {
        const x=t.clientX, y=t.clientY;
        const jRect = document.getElementById('joystick-area').getBoundingClientRect();
        const dj = Math.hypot(x-(jRect.left+72.5), y-(jRect.top+72.5));
        if (dj<85 || joyData.id===t.identifier) {
            joyData.id=t.identifier;
            joyData.x=Math.max(-55,Math.min(55,x-(jRect.left+72.5)));
            joyData.y=Math.max(-55,Math.min(55,y-(jRect.top+72.5)));
            document.getElementById('joystick-stick').style.transform=`translate(${joyData.x}px,${joyData.y}px)`;
            continue;
        }
        Object.keys(btns).forEach(key => {
            const b=btns[key];
            if (!b || b.style.display==='none') return;
            const r=b.getBoundingClientRect();
            if (x>r.left-15&&x<r.right+15&&y>r.top-15&&y<r.bottom+15) {
                b.classList.add('active-btn');
                if (e.type==='touchstart') {
                    if (dialog.active) return;
                    if (key==='jump'&&player.y===0&&!player.rolling) player.velY=13;
                    if (key==='roll') useCommand('roll','press');
                }
            }
        });
    }

    // ── INTERAÇÃO CONTEXTUAL no touch — tocar no indicador (que acompanha o
    //    objeto na tela) confirma a interação. Só aparece quando há algo perto. ──
    if (e.type==='touchstart' && !dialog.active && InteractionManager.hasTarget()) {
        const pr = InteractionManager.promptRect();
        if (pr) {
            for (let t of e.touches) {
                if (t.clientX>pr.x-14 && t.clientX<pr.x+pr.w+14 && t.clientY>pr.y-14 && t.clientY<pr.y+pr.h+14) {
                    InteractionManager.confirm();
                    return;
                }
            }
        }
    }

    // ── 4 SLOTS no touch — encostar = press, soltar = release (suporta segurar
    //    para carregar o pesado / manter a defesa). Mesmo caminho do teclado e
    //    do gamepad: o botão só "usa o slot"; o equipamento decide a ação. ──
    if (!dialog.active) {
        for (const slot of SLOT_NAMES) {
            const el = document.querySelector('#slot-pad [data-slot="' + slot + '"]');
            const down = touchInsideEl(el, e.touches, 10);
            if (down && !slotTouchDown[slot])      { slotTouchDown[slot] = true;  useEquipmentSlot(slot, 'press'); }
            else if (!down && slotTouchDown[slot]) { slotTouchDown[slot] = false; useEquipmentSlot(slot, 'release'); }
            if (el) el.classList.toggle('active-btn', down);
        }
    }
}
// Diálogo no celular: tocar na caixa de diálogo avança a fala (sem botão fixo).
(function(){
    const dbox = document.getElementById('dialog-box');
    if(dbox) dbox.addEventListener('touchend', ev => { ev.preventDefault(); if(dialog.active) advanceDialog(); }, {passive:false});
})();
window.addEventListener('touchstart', updateInputs, {passive:false});
window.addEventListener('touchmove',  updateInputs, {passive:false});
window.addEventListener('touchend', e => {
    if (screen!=='game' || paused) return;
    let active=false;
    for (let t of e.touches) if (t.identifier===joyData.id) active=true;
    if (!active) {
        joyData.id=null; joyData.x=0; joyData.y=0;
        document.getElementById('joystick-stick').style.transform='translate(0,0)';
    }
    updateInputs(e);
},{passive:false});

// ── ROLL / ESQUIVA (V26) ────────────────────────────────────
// Não é dash/teleporte: o personagem se abaixa e avança uma distância curta
// em velocidade controlada, integrando a posição frame a frame (o loop aplica
// as mesmas colisões da caminhada, então não atravessa paredes).
function doRoll() {
    if (screen!=='game' || paused || gameOver || dialog.active) return;
    if (player.rolling || player.rollCd>0) return;
    if (player.isAttacking || heavyCharge.active || player.blocking || player.knockback>0) return;
    const custo = 14;
    if (stamina < custo) return;
    stamina -= custo;
    player.rolling  = true;
    player.rollT    = ROLL_DURATION;
    player.rollCd   = ROLL_DURATION + ROLL_COOLDOWN;
    player.rollDirX = Math.cos(player.angle);
    player.rollDirZ = Math.sin(player.angle);
    rollFxTimer = Math.max(rollFxTimer, 18);
    spawnEffect('roll_dust', player.x, player.z, {
        ang: player.angle,
        elev: (zone==='overworld' && player.onPlateau) ? PLATEAU.elev : 0
    });
    // cancela qualquer input de ataque pendente para não sair ataque no fim do roll
    attackInput.active = false; attackInput.t = 0;
}

// ── FLUXO ÚNICO DE ATAQUE (V26) ─────────────────────────────
// O botão/tecla de ataque consulta a ARMA EQUIPADA:
//  · espada (kind 'melee')      → toque = leve, segurar = pesado (sistema existente)
//  · bumerangue (kind 'boomerang') → arremessa; segurar controla o mágico
function equippedWeaponKind(){
    const w = getEquippedWeapon();
    return w ? (w.kind || 'melee') : null;
}
function startAttackInput() {
    if (screen!=='game' || paused || gameOver || dialog.active) return;
    if (!weaponEquipped() || player.rolling || player.blocking) return;

    if (equippedWeaponKind() === 'boomerang') {
        boomerangControlHeld = true;
        if (!boomerang.active && boomerangCd <= 0) throwBoomerang(equippedWeapon);
        return;
    }
    if (attackInput.active) return;
    attackInput.active = true;
    attackInput.t = 0;
}
function releaseAttackInput() {
    if (equippedWeaponKind() === 'boomerang') { boomerangControlHeld = false; return; }
    if (!attackInput.active) return;
    attackInput.active = false;
    attackInput.t = 0;
    if (heavyCharge.active) releaseHeavyCharge();      // já decide pesado x toque-pesado
    else                    iniciarAtaque('light', 6, HITBOXES.sword_light.reach, HITBOXES.sword_light.tol, 8);
}

// ── CONSUMÍVEIS (poções) ────────────────────────────────────
// Usa o MESMO sistema de vida (corações/quartos). Não cria vida separada.
function useConsumable(entry){
    if (!entry || entry.type !== 'consumable' || entry.quantity <= 0) return false;
    if (player.hp >= player.maxHp) { showToast('A vida já está cheia.'); return false; }
    player.hp = Math.min(player.maxHp, player.hp + entry.heal);   // nunca passa do máximo
    entry.quantity -= 1;                                          // remove do inventário após uso
    spawnEffect('heal', player.x, player.z, {
        elev:(zone==='overworld'&&player.onPlateau)?PLATEAU.elev:0
    });
    showToast(entry.name + ' usada  ·  +' + entry.heal + ' de vida');
    return true;
}

function iniciarAtaque(tipo,dano,alcance,tol,impulso) {
    if (!weaponEquipped()||player.isAttacking||player.rolling||dialog.active||player.blocking) return;
    player.isAttacking=true; player.atkType=tipo;   // V33: golpe individual (sem combo)

    // O combate consulta a arma equipada no inventário (arquitetura V26)
    const w = getEquippedWeapon();
    if (w && w.dmgMult && w.dmgMult!==1) dano = Math.round(dano * w.dmgMult);

    player.vx+=Math.cos(player.angle)*impulso*0.32;
    player.vz+=Math.sin(player.angle)*impulso*0.32;
    player.knockback=6;
    const swingDelay = (tipo==='heavy') ? 250 : 100;
    setTimeout(()=>{
        // Um único caminho de dano para TODOS os inimigos: o golpe encosta →
        // enemyTakeDamage(inimigo, dano). A vida cai exatamente pelo dano recebido.
        swordHit(enemy,       dano, alcance,      tol,        tipo==='heavy'?14:12);
        swordHit(bird,        dano, alcance+24,   tol+0.25,   tipo==='heavy'?9:7);
        swordHit(seedShooter, dano, alcance,      tol+0.15,   tipo==='heavy'?12:10);
        swordHit(octorokRed,  dano, alcance,      tol+0.1,    tipo==='heavy'?12:10);   // V31
        swordHit(octorokBlue, dano, alcance,      tol+0.1,    tipo==='heavy'?12:10);
        swordHit(moblinRed,   dano, alcance,      tol,        tipo==='heavy'?14:12);
        swordHit(moblinBlue,  dano, alcance,      tol,        tipo==='heavy'?14:12);
        swordHitDestructibles(dano, alcance, tol);   // V34: mesma hitbox corta grama/arbusto/vaso/caixa
        player.isAttacking=false;
    }, swingDelay);
}
// Testa se o golpe alcança o inimigo (distância + ângulo) e aplica dano central.
// Hitbox da espada (distância + ângulo) — fonte única p/ inimigos e objetos (V34).
function inSwordArc(x, z, reach, tol){
    const dx=x-player.x, dz=z-player.z;
    if(Math.hypot(dx,dz) >= reach) return false;
    let diff=Math.atan2(dz,dx)-player.angle; while(diff>Math.PI) diff-=Math.PI*2; while(diff<-Math.PI) diff+=Math.PI*2;
    return Math.abs(diff) < tol;
}
function swordHit(en, dano, reach, tol, kb){
    if(zone!=='overworld' || !en || en.dead || en.hp<=0) return;
    if(en===enemy && player.onPlateau) return;            // goblin não é atacável do platô
    if(!inSwordArc(en.x, en.z, reach, tol)) return;
    const ang=Math.atan2(en.z-player.z, en.x-player.x);
    enemyTakeDamage(en, dano, { type:'sword', kbAng:ang, kb:kb, kbFrames:10, freeze:3 });
}

// ── SISTEMA CENTRAL DE VIDA DOS INIMIGOS (V26.2) ────────────
// enemyTakeDamage(inimigo, dano [, opts]) — vale para goblin, pássaro,
// atirador de sementes e qualquer inimigo futuro. Sem lógica por-inimigo aqui.
//   opts.type   : 'sword' | 'boomerang' | 'seed' ...  (respeita imunidades de estado)
//   opts.kbAng/opts.kb/opts.kbFrames : empurrão
//   opts.stunMs : atordoamento em ms
//   opts.freeze : frames de "hit stop"
function enemyTakeDamage(en, damage, opts){
    opts = opts || {};
    if(!en || en.dead || en.hp<=0) return;
    // imunidade É propriedade do estado do inimigo, não exceção no código do jogador
    if(en.invulnerable) return;
    if(opts.type==='sword' && en.swordImmune) return;

    en.hp = Math.max(0, en.hp - damage);
    en.flash = 6;
    en.hasBeenHit = true;
    spawnEffect('hit', en.x, en.z, { elev: en.elev || 0 });   // impacto — efeito independente
    if(opts.freeze) freezeFrames = Math.max(freezeFrames, opts.freeze);
    if(opts.kb && opts.kbAng!==undefined){
        en.kbX = Math.cos(opts.kbAng)*opts.kb;
        en.kbZ = Math.sin(opts.kbAng)*opts.kb;
        en.knockback = opts.kbFrames || 10;
    }
    if(opts.stunMs) en.stunT = Math.max(en.stunT||0, opts.stunMs/1000);

    if(en.hp<=0) enemyDie(en);
}
function enemyDie(en){
    if(en.dead) return;
    en.hp = 0;
    en.dead = true;
    en.deathT = 0;           // tempo decorrido da animação de morte
    en.deathFxDone = false;   // efeito pós-morte (sequência) já disparado?
    if(en.id==='goblin')       showToast('Goblin derrotado!');
    else if(en.id==='bird')    showToast('Pássaro derrotado!');
    else if(en.id==='seed_shooter') showToast('Atirador de Sementes destruído!');
    else if(en.id==='octorok')      showToast((en.name || 'Octorok') + ' derrotado!');
    else if(en.id==='spear_moblin') showToast((en.name || 'Spear Moblin') + ' derrotado!');
    if(typeof enemyDropOnDeath === 'function') enemyDropOnDeath(en);   // V31: drop pelo sistema central
}

// ── MORTE DOS INIMIGOS: animação de morte → efeito pós-morte ────────────────
// Fluxo pedido:  enemyDie() marca `dead`  →  roda a animação de morte (quando
// houver folha; sem folha, respiro mínimo)  →  ao TERMINAR, dispara
// spawnEffect('enemy_death') e o inimigo some. O efeito (13 quadros) segue
// sozinho no sistema Effects. A mecânica não conhece os frames.
const ENEMY_DEATH_ANIM_MIN = 0.18;   // s — usado só enquanto não há folha de morte
function updateEnemyDeaths(dt){
    for(const en of enemies){
        if(!en.dead || en.deathFxDone) continue;
        en.deathT = (en.deathT || 0) + dt;
        const animDur = AnimationManager.duration(en.id, 'death') || ENEMY_DEATH_ANIM_MIN;
        if(en.deathT >= animDur){
            const elev = (en === bird) ? (PLATEAU.elev + bird.alt) : 0;
            spawnEffect('enemy_death', en.x, en.z, { elev });
            en.deathFxDone = true;
        }
    }
}
// Inimigo ainda aparece na tela? (vivo, ou morto mas ainda na animação de morte)
function enemyStillShown(en){ return !en.dead || !en.deathFxDone; }

// ── DANO NO JOGADOR + ESCUDO DIRECIONAL (V33) ───────────────
// attack.type      : tipo do ataque (ver SHIELD_TIERS) — padrão 'physical'
// attack.fromAngle : de onde o ataque vem (padrão: direção da origem srcX/srcZ)
// Retorna true se o escudo bloqueou (sem dano). Sem invencibilidade: o roll
// e o dano recente não protegem o jogador.
function damagePlayer(amount, srcX, srcZ, force, attack){
    attack = attack || {};
    const fromAng = (attack.fromAngle !== undefined) ? attack.fromAngle
                                                     : Math.atan2(srcZ-player.z, srcX-player.x);
    const a=Math.atan2(player.z-srcZ,player.x-srcX);
    if(shieldBlocks(attack.type || 'physical', fromAng)){
        onShieldBlock();
        force*=0.45;                                   // bloqueou: só um empurrão leve
        player.kbX=Math.cos(a)*force; player.kbZ=Math.sin(a)*force; player.knockback=7;
        return true;
    }
    player.hp-=amount; player.flash=8;
    if(player.carrying) dropCarried();                 // V34: levou dano carregando → o vaso cai e quebra
    const pElev=(zone==='overworld'&&player.onPlateau)?PLATEAU.elev:0;
    spawnEffect('damage', player.x, player.z, { elev:pElev, color:'#ff6b6b' });
    freezeFrames = Math.max(freezeFrames, 3);          // hit-stop curto: deixa claro que acertou
    player.kbX=Math.cos(a)*force; player.kbZ=Math.sin(a)*force; player.knockback=7;
    return false;
}
// Projétil inimigo x jogador (pedra, semente, futuros fogo/magia...).
// Retorna true se o projétil foi consumido (bloqueado pelo escudo ou acertou).
function resolveEnemyProjectile(p, hb, damage, force){
    const d = Math.hypot(p.x - player.x, p.z - player.z);
    const fromAng = Math.atan2(-p.vz, -p.vx);          // vem do lado oposto ao movimento
    if(d < hb.blockRadius && shieldBlocks(p.type, fromAng)){ onShieldBlock(); return true; }
    if(d < hb.hitPlayer){
        damagePlayer(damage, p.x, p.z, force, { type:p.type, fromAngle:fromAng });
        return true;
    }
    return false;
}

// ── RELEVO: colisão, escada e porta da caverna ───────────────
// Empurra `o` para fora de um retângulo {minX,maxX,minZ,maxZ} pela borda mais
// próxima. Mesma colisão do relevo, reaproveitada pelos objetos sólidos (V34).
function pushOutOfRect(o, P){
    if(o.x<=P.minX||o.x>=P.maxX||o.z<=P.minZ||o.z>=P.maxZ) return false;
    const dL=o.x-P.minX, dR=P.maxX-o.x, dT=o.z-P.minZ, dB=P.maxZ-o.z;
    const m=Math.min(dL,dR,dT,dB);
    if(m===dB)      o.z=P.maxZ+1;
    else if(m===dT) o.z=P.minZ-1;
    else if(m===dL) o.x=P.minX-1;
    else            o.x=P.maxX+1;
    return true;
}
function pushOutOfPlateau(o){ pushOutOfRect(o, PLATEAU); }
function updatePlateau(){
    const P=PLATEAU;
    if(!player.onPlateau){
        // Porta da caverna, aberta na parede sul do relevo
        if(caveTransitionCd<=0 &&
           Math.abs(player.x-CAVE_DOOR.x)<CAVE_DOOR.w/2 &&
           player.z<P.maxZ+10 && player.z>P.maxZ-70){ enterCave(); return; }

        const inside = player.x>P.minX && player.x<P.maxX && player.z>P.minZ && player.z<P.maxZ;
        if(inside){
            const naEscada = Math.abs(player.x-STAIR.x)<STAIR.w/2;
            if(naEscada && player.z>P.maxZ-80){
                player.onPlateau=true;
                player.z=P.maxZ-36;
                player.knockback=0; player.kbX=0; player.kbZ=0;
            }else{
                pushOutOfPlateau(player);
                player.vx*=0.2; player.vz*=0.2;
                player.knockback=0; player.kbX=0; player.kbZ=0;
            }
        }
    }else{
        const pad=20;
        player.x=Math.max(P.minX+pad,Math.min(P.maxX-pad,player.x));
        if(player.z<P.minZ+pad) player.z=P.minZ+pad;
        if(player.z>P.maxZ-pad){
            if(Math.abs(player.x-STAIR.x)<STAIR.w/2){
                if(player.z>P.maxZ-6){
                    player.onPlateau=false;
                    player.z=P.maxZ+26;
                    player.knockback=0; player.kbX=0; player.kbZ=0;
                }
            }else{
                player.z=P.maxZ-pad;
                player.vz=Math.min(player.vz,0);
            }
        }
    }
}

// ── PÁSSARO ─────────────────────────────────────────────────
function setBirdState(s){ bird.state=s; bird.t=0; }
function updateBird(dt){
    if(bird.dead || bird.hp<=0) return;
    if(bird.hitCd>0) bird.hitCd-=dt;
    if(bird.flash>0) bird.flash--;
    if(bird.chipFx>0) bird.chipFx--;
    if(bird.stunT>0) bird.stunT-=dt;
    bird.t+=dt;

    if(bird.knockback>0){
        bird.x+=bird.kbX; bird.z+=bird.kbZ;
        bird.kbX*=0.82; bird.kbZ*=0.82; bird.knockback--;
    }

    const engaged = player.onPlateau && zone==='overworld' && bird.stunT<=0;

    if(bird.state==='perch'){
        bird.alt += (66-bird.alt)*0.08;
        bird.x   += (TREE.x+30-bird.x)*0.06;
        bird.z   += (TREE.z+8 -bird.z)*0.06;
        if(engaged && bird.t>0.6) setBirdState('aim');
    }else if(bird.state==='aim'){
        bird.alt += (86-bird.alt)*0.08;
        const orb=Math.atan2(bird.z-player.z, bird.x-player.x)+1.1*dt;
        const tx=player.x+Math.cos(orb)*175, tz=player.z+Math.sin(orb)*175;
        bird.x += (tx-bird.x)*0.06;
        bird.z += (tz-bird.z)*0.06;
        if(!engaged) setBirdState('perch');
        else if(bird.t>0.85){
            const a=Math.atan2(player.z-bird.z, player.x-bird.x);
            bird.dirX=Math.cos(a); bird.dirZ=Math.sin(a);
            bird.hitDone=false;
            setBirdState('dash');
        }
    }else if(bird.state==='dash'){
        bird.x+=bird.dirX*15; bird.z+=bird.dirZ*15;
        bird.alt += (26-bird.alt)*0.25;
        const d=Math.hypot(player.x-bird.x, player.z-bird.z);
        if(!bird.hitDone && d<42){
            bird.hitDone=true;
            damagePlayer(bird.damage, bird.x, bird.z, 4, { type:'physical' });   // dano central do inimigo
        }
        if(bird.state==='dash' && bird.t>0.42) setBirdState('recover');
    }else{ // recover
        bird.alt += (28-bird.alt)*0.12;
        bird.x -= bird.dirX*1.1; bird.z -= bird.dirZ*1.1;
        if(bird.t>0.85){
            // V26.2: sem auto-cura. A vida do pássaro cai só pelo dano recebido.
            setBirdState(engaged?'aim':'perch');
        }
    }

    if(bird.x<player.x) bird.face=1; else bird.face=-1;
    bird.x=Math.max(PLATEAU.minX+14,Math.min(PLATEAU.maxX-14,bird.x));
    bird.z=Math.max(PLATEAU.minZ+14,Math.min(PLATEAU.maxZ-14,bird.z));
}

// ── COLISÃO SÓLIDA CENTRAL (para projéteis) ─────────────────
// Um ponto do mundo é "sólido"? Usada por semente e bumerangue para
// colidir/rebater. Reaproveita os mesmos limites de PLATEAU / CAVE_ROOM.
function isSolidAt(x, z){
    if(zone==='cave'){
        const R=CAVE_ROOM;
        return (x < R.minX+8 || x > R.maxX-8 || z < R.minZ+8 || z > R.maxZ-8);
    }
    const P=PLATEAU;
    if(player.onPlateau){
        // no alto do platô: as bordas do platô são as paredes
        return (x < P.minX+2 || x > P.maxX-2 || z < P.minZ+2 || z > P.maxZ-2);
    }
    // no chão: o bloco do relevo é um obstáculo sólido
    return (x > P.minX && x < P.maxX && z > P.minZ && z < P.maxZ);
}

// ── DIREÇÃO EM 4 (para o Atirador de Sementes) ──────────────
function faceDir4(o){
    const dx=player.x-o.x, dz=player.z-o.z;
    if(Math.abs(dx) > Math.abs(dz)) return dx>0 ? 'right' : 'left';
    return dz>0 ? 'down' : 'up';
}
const DIR4_VEC = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };

// ── INIMIGO 3: ATIRADOR DE SEMENTES — estados HIDDEN / ALERT ─
function updateSeedShooter(dt){
    const s=seedShooter, C=SEED_SHOOTER_CFG;
    if(s.dead) return;
    if(s.flash>0) s.flash--;
    if(s.stunT>0) s.stunT-=dt;
    if(s.knockback>0){ s.x+=s.kbX; s.z+=s.kbZ; s.kbX*=0.8; s.kbZ*=0.8; s.knockback--; }
    // fica FIXO: qualquer empurrão é desfeito ao acabar (não persegue, não anda)
    else { s.x += (SEED_SHOOTER_SPAWN.x - s.x)*0.06; s.z += (SEED_SHOOTER_SPAWN.z - s.z)*0.06; }

    const d = Math.hypot(player.x - s.x, player.z - s.z);

    if(d < C.hideRange){
        // ESCONDIDO — entra na terra, vira "arbusto", imune à espada, não dispara
        if(s.state!=='hidden'){ s.state='hidden'; s.anim=0; }
        s.anim = Math.min(1, s.anim + dt*3);
        s.swordImmune = true;               // imunidade = propriedade DESTE estado
        s.invulnerable = false;
        s.fireT = 0;
    } else if(d < C.alertRange){
        // ALERTA — sai da terra, fica em pé, vulnerável, mira e dispara
        if(s.state!=='alert'){ s.state='alert'; s.anim=0; s.fireT = C.attackCooldown*0.5; }
        s.anim = Math.min(1, s.anim + dt*3);
        s.swordImmune = false;
        s.invulnerable = false;
        s.dir = faceDir4(s);                 // olha o jogador em 4 direções
        if(s.stunT<=0){
            s.fireT -= dt;
            if(s.fireT <= 0){ s.fireT = C.attackCooldown; spawnSeed(s); }
        }
    } else {
        // longe demais: volta a ficar escondido (arbusto), imune, sem disparar
        if(s.state!=='hidden'){ s.state='hidden'; s.anim=0; }
        s.anim = Math.min(1, s.anim + dt*3);
        s.swordImmune = true;
        s.fireT = 0;
    }
}
function spawnSeed(s){
    const C=SEED_SHOOTER_CFG;
    const v = DIR4_VEC[s.dir];
    seeds.push({
        x:s.x, z:s.z-16,
        vx:v[0]*C.seedSpeed, vz:v[1]*C.seedSpeed,   // direção travada no disparo (não persegue)
        dist:0, maxDist:C.seedRange,
        type:C.projectileType, dead:false, spin:0
    });
}

// ── PROJÉTEIS DE SEMENTE ────────────────────────────────────
function updateSeeds(dt){
    if(!seeds.length) return;
    for(const p of seeds){
        if(p.dead) continue;
        p.spin += dt*18;
        const nx = p.x + p.vx, nz = p.z + p.vz;
        if(isSolidAt(nx, nz)){ p.dead = true; continue; }   // não atravessa parede
        p.x = nx; p.z = nz;
        p.dist += Math.hypot(p.vx, p.vz);
        if(p.dist >= p.maxDist){ p.dead = true; continue; } // some ao atingir o alcance

        // V33: escudo direcional por tipo ('piercing' — o escudo inicial não segura)
        if(resolveEnemyProjectile(p, HITBOXES.seed, seedShooter.damage, 5)){ p.dead = true; continue; }
    }
    seeds = seeds.filter(p => !p.dead);
}

/* ═══════════════════════════════════════════════════════════════════════════
   V31 — MECÂNICAS: BOMBA · ARCO/FLECHA · PEDRA · OCTOROK · SPEAR MOBLIN
   Reaproveita isSolidAt (paredes), enemyTakeDamage / enemyDie (vida dos
   inimigos), damagePlayer (escudo/knockback), spawnEffect e o sistema
   central de drop. Nenhum sistema paralelo.
   ═══════════════════════════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════════════════════════
   V34 — OBJETOS DESTRUTÍVEIS (sistema central)
   ───────────────────────────────────────────────────────────────────────────
   Tipo de objeto  = uma entrada em DESTRUCTIBLE_TYPES.
   Objeto no mapa  = uma linha em DESTRUCTIBLE_SPAWNS (só vira destrutível
                     o que estiver listado aqui — nada é convertido sozinho).
   Reaproveita: inSwordArc (hitbox da espada), explodeBomb (raio + lineBlocked
   → onBombHit), pushOutOfRect (colisão do relevo), spawnDropFromTable →
   rollDrop → dropUnlocked (drops) e spawnEffect (efeitos).

   breakBy   : fonte de dano → true. Hoje: 'sword' | 'bomb'. Futuras
               ferramentas (martelo, bumerangue, escudo melhorado...) entram
               só como nova chave + uma chamada a damageDestructible().
   minDamage : dano mínimo por golpe para contar.
   requires  : (opcional) function(source) → bool — trava atrás de upgrade.
   solid     : bloqueia jogador/inimigos terrestres (pode ser sobrescrito
               por objeto no spawn).
   ═══════════════════════════════════════════════════════════════════════════ */
const DESTRUCTIBLE_TYPES = {
    grass: { name:'Grama',   hp:1, solid:false, w:26, h:16, drawH:22, breakBy:{ sword:true, bomb:true },
             dropTable:'obj_grass', asset:'obj_grass', debris:{ color:'#6cbf4f', alt:'#3f8a33', count:7, shape:'leaf'  } },
    bush:  { name:'Arbusto', hp:1, solid:true,  w:30, h:22, drawH:34, breakBy:{ sword:true, bomb:true },
             dropTable:'obj_bush',  asset:'obj_bush',  debris:{ color:'#4f9a3c', alt:'#2f6a2a', count:9, shape:'leaf'  } },
    vase:  { name:'Vaso',    hp:1, solid:true,  w:22, h:18, drawH:30, breakBy:{ sword:true, bomb:true }, liftable:true,
             dropTable:'obj_vase',  asset:'obj_vase',  debris:{ color:'#c4865a', alt:'#8a5634', count:8, shape:'shard' } },
    crate: { name:'Caixa',   hp:6, solid:true,  w:32, h:26, drawH:34, breakBy:{ sword:true, bomb:true },   // golpe leve (6) quebra; toque fraco (4) precisa de 2
             dropTable:'obj_crate', asset:'obj_crate', debris:{ color:'#a87945', alt:'#6e4b26', count:8, shape:'plank' } },
    rock:  { name:'Pedra',   hp:8, solid:true,  w:34, h:26, drawH:30, breakBy:{ bomb:true },               // espada não quebra
             dropTable:'obj_rock',  asset:'obj_rock',  debris:{ color:'#8d8d86', alt:'#5b5b55', count:8, shape:'chunk' } }
};
const DESTRUCTIBLE_COLLISION_PAD = 14;   // "raio" do corpo que encosta no objeto
// area: 'overworld' (chão) | 'plateau' (alto do relevo) | 'cave'
const DESTRUCTIBLE_SPAWNS = [
    // chão perto do início
    { type:'grass', x:-90,  z:70,  area:'overworld' },

function makeDestructible(s, i){
    const cfg = DESTRUCTIBLE_TYPES[s.type];
    return {
        id: s.id || (s.type + '_' + i), type: s.type, cfg,
        x: s.x, z: s.z, area: s.area || 'overworld',
        zone: s.area === 'cave' ? 'cave' : 'overworld',            // mesmo vocabulário de `zone`/bombas
        elev: s.area === 'plateau' ? PLATEAU.elev : 0,
        hp: cfg.hp, solid: (s.solid !== undefined) ? s.solid : cfg.solid,
        flash: 0, dead: false,
        onBombHit(){ damageDestructible(this, 'bomb', BOMB_CFG.damage); }   // contrato do explodeBomb (V31)
    };
}
let destructibles = DESTRUCTIBLE_SPAWNS.map(makeDestructible);
// Objetos destruídos ficam destruídos até um novo jogo (entrar/sair da caverna não os recria).
function resetDestructibles(){ destructibles = DESTRUCTIBLE_SPAWNS.map(makeDestructible); }
// O objeto está no mesmo "piso" que o jogador? (zona + chão/alto do relevo)
function destructibleInPlayerArea(o){
    if(o.zone !== zone) return false;
    return o.zone === 'cave' || ((o.area === 'plateau') === !!player.onPlateau);
}
// Ponto único de dano em objetos. source: 'sword' | 'bomb' | futuras ferramentas.
function damageDestructible(o, source, dmg){
    if(!o || o.dead) return false;
    const c = o.cfg;
    if(!c.breakBy[source]) return false;
    if(c.requires && !c.requires(source)) return false;
    if(dmg < (c.minDamage || 0)) return false;
    o.hp -= dmg;
    o.flash = 6;
    if(o.hp > 0){ spawnEffect('hit', o.x, o.z, { elev:o.elev }); return true; }
    destroyDestructible(o);
    return true;
}
function destroyDestructible(o){
    if(o.dead) return;
    o.dead = true;                                                  // some, perde colisão e não dropa de novo
    shatterObject(o.cfg, o.x, o.z, o.elev);
}
// Efeito de fragmentos + drop do tipo. Usado ao destruir no lugar e ao quebrar um arremessado.
function shatterObject(cfg, x, z, elev){
    spawnEffect('debris', x, z, Object.assign({ elev }, cfg.debris));
    spawnDropFromTable(cfg.dropTable, x, z, elev);
}
function swordHitDestructibles(dano, reach, tol){
    for(const o of destructibles){
        if(o.dead || !destructibleInPlayerArea(o)) continue;
        if(inSwordArc(o.x, o.z, reach, tol)) damageDestructible(o, 'sword', dano);
    }
}
// Por frame: piscada de impacto + colisão dos objetos sólidos (jogador e inimigos terrestres).
function updateDestructibles(){
    const pad = DESTRUCTIBLE_COLLISION_PAD;
    for(const o of destructibles){
        if(o.flash > 0) o.flash--;
        if(o.dead || !o.solid) continue;
        const R = { minX:o.x - o.cfg.w/2 - pad, maxX:o.x + o.cfg.w/2 + pad,
                    minZ:o.z - o.cfg.h/2 - pad, maxZ:o.z + o.cfg.h/2 + pad };
        if(destructibleInPlayerArea(o)) pushOutOfRect(player, R);
        if(zone === 'overworld' && o.zone === 'overworld' && o.area !== 'plateau'){
            for(const en of [enemy, octorokRed, octorokBlue, moblinRed, moblinBlue])
                if(!en.dead) pushOutOfRect(en, R);
        }
    }
}

// ── LEVANTAR / CARREGAR / ARREMESSAR (V34) ──────────────────
// Vale para qualquer tipo com `liftable:true` (hoje só o vaso).
//  · [B] LEVANTAR (interação contextual) → o objeto sai do mundo (dead, sem
//    drop) e vai para player.carrying, acima da cabeça.
//  · Carregando: anda mais devagar, sem correr/rolar/atacar/defender.
//    [B] ARREMESSAR ou qualquer slot → vira projétil em thrownObjects.
//  · Projétil quebra (fragmentos + drop do tipo) em parede (isSolidAt), objeto
//    sólido, ao cair no chão, ou em inimigo (dano pequeno via enemyTakeDamage).
//  · Levar dano carregando → o objeto cai e quebra aos pés do jogador.
const CARRY_CFG = {
    liftRange: 52,          // distância para aparecer [B] LEVANTAR
    liftTime: 0.2,          // s — o objeto sobe do chão até a cabeça (não arremessa nesse meio-tempo)
    headH: 62,              // altura acima da base do jogador
    speedMult: 0.8,         // velocidade andando com o objeto
    throwSpeed: 7.5,        // px/frame
    throwDist: 4 * TILE,    // alcance antes de cair e quebrar
    throwDamage: 2          // ½ coração de dano no inimigo
};
player.carrying = null;     // objeto destrutível nas mãos (ou null)
player.liftT = 0;
let thrownObjects = [];     // { obj, x, z, dirX, dirZ, dist, h, zone, area, elev, done }

function playerArea(){ return zone === 'cave' ? 'cave' : (player.onPlateau ? 'plateau' : 'overworld'); }
function nearestLiftable(){
    if(player.carrying || player.isAttacking || player.rolling || heavyCharge.active) return null;
    let best = null, bd = CARRY_CFG.liftRange;
    for(const o of destructibles){
        if(o.dead || !o.cfg.liftable || !destructibleInPlayerArea(o)) continue;
        const d = Math.hypot(player.x - o.x, player.z - o.z);
        if(d < bd){ bd = d; best = o; }
    }
    return best;
}
function liftDestructible(o){
    if(!o || o.dead || player.carrying) return;
    o.dead = true;                     // sai do mundo: sem colisão, sem espada/bomba, sem drop agora
    o.lifted = true;
    player.carrying = o;
    player.liftT = CARRY_CFG.liftTime;
    attackInput.active = false; attackInput.t = 0; heavyCharge.active = false;
    player.blocking = false;
}
function throwCarried(){
    const o = player.carrying;
    if(!o || player.liftT > 0) return;
    player.carrying = null;
    const a = player.angle;
    thrownObjects.push({
        obj: o, x: player.x + Math.cos(a) * 14, z: player.z + Math.sin(a) * 14,
        dirX: Math.cos(a), dirZ: Math.sin(a), dist: 0, h: CARRY_CFG.headH,
        zone: zone, area: playerArea(),
        elev: (zone === 'overworld' && player.onPlateau) ? PLATEAU.elev : 0, done: false
    });
}
function dropCarried(){
    const o = player.carrying;
    if(!o) return;
    player.carrying = null; player.liftT = 0;
    shatterObject(o.cfg, player.x, player.z, (zone === 'overworld' && player.onPlateau) ? PLATEAU.elev : 0);
}
function breakThrown(p){
    p.done = true;
    shatterObject(p.obj.cfg, p.x, p.z, p.elev);
}
function updateThrownObjects(dt){
    if(!thrownObjects.length) return;
    for(const p of thrownObjects){
        if(p.done) continue;
        const nx = p.x + p.dirX * CARRY_CFG.throwSpeed, nz = p.z + p.dirZ * CARRY_CFG.throwSpeed;
        if(p.zone !== zone || isSolidAt(nx, nz)){ breakThrown(p); continue; }        // parede
        p.x = nx; p.z = nz;
        p.dist += CARRY_CFG.throwSpeed;
        const t = Math.min(1, p.dist / CARRY_CFG.throwDist);
        p.h = CARRY_CFG.headH * (1 - t) + 16 * Math.sin(Math.PI * t);               // arco curto até o chão
        if(t >= 1){ breakThrown(p); continue; }                                      // caiu no chão
        let hitObj = false;                                                          // outro objeto sólido
        for(const o of destructibles){
            if(o.dead || !o.solid || o.zone !== p.zone || o.area !== p.area) continue;
            if(Math.abs(o.x - p.x) < o.cfg.w/2 + 6 && Math.abs(o.z - p.z) < o.cfg.h/2 + 6){ hitObj = true; break; }
        }
        if(hitObj){ breakThrown(p); continue; }
        for(const en of enemies){                                                    // inimigo: dano pequeno + quebra
            if(en.dead || en.hp <= 0 || (en.zoneName && en.zoneName !== p.zone)) continue;
            if((en === bird) !== (p.area === 'plateau')) continue;                   // chão x alto do relevo
            if(Math.hypot(en.x - p.x, en.z - p.z) < HITBOXES.thrown.hit){
                enemyTakeDamage(en, CARRY_CFG.throwDamage, {
                    type:'thrown', kbAng:Math.atan2(p.dirZ, p.dirX), kb:6, kbFrames:8, freeze:2
                });
                breakThrown(p);
                break;
            }
        }
    }
    thrownObjects = thrownObjects.filter(p => !p.done);
}
const SOUNDS = { moblin_alert: null /* assets/enemies/spear_moblin/alert.ogg */ };
function playSound(id){
    const src = SOUNDS[id];
    if(!src) return;                       // sem asset ainda → silêncio (hook pronto)
    try{ const a = new Audio(src); a.volume = 0.5; a.play(); }catch(e){}
}
// Há parede sólida no segmento (x0,z0)→(x1,z1)? (linha de visão / raio da bomba)
function lineBlocked(x0, z0, x1, z1){
    const steps = Math.max(2, Math.ceil(Math.hypot(x1 - x0, z1 - z0) / 12));
    for(let i = 1; i < steps; i++){
        const t = i / steps;
        if(isSolidAt(x0 + (x1 - x0) * t, z0 + (z1 - z0) * t)) return true;
    }
    return false;
}

// ── BOMBA ──────────────────────────────────────────────────────────────
function placeBomb(){
    if(!player.hasBomb || bombs.length >= BOMB_CFG.maxActive) return;
    const fx = Math.cos(player.angle), fz = Math.sin(player.angle);
    bombs.push({
        x: player.x + fx * 20, z: player.z + fz * 20,
        elev: (zone === 'overworld' && player.onPlateau) ? PLATEAU.elev : 0,
        zone: zone, t: 0, exploded: false
    });
}
function explodeBomb(b){
    spawnEffect('explosion', b.x, b.z, { elev: b.elev, radius: BOMB_CFG.radius, ang: Math.random() * 6.28 });
    freezeFrames = Math.max(freezeFrames, 3);
    for(const en of enemies){
        if(en.dead || en.hp <= 0) continue;
        if(en.zoneName && en.zoneName !== b.zone) continue;
        if(Math.hypot(en.x - b.x, en.z - b.z) > BOMB_CFG.radius) continue;
        if(lineBlocked(b.x, b.z, en.x, en.z)) continue;              // não atravessa parede
        const ang = Math.atan2(en.z - b.z, en.x - b.x);
        enemyTakeDamage(en, BOMB_CFG.damage, { type:'bomb', kbAng:ang, kb:BOMB_CFG.kb, kbFrames:12, freeze:2 });
    }
    if(b.zone === zone){
        const dp = Math.hypot(player.x - b.x, player.z - b.z);
        if(dp <= BOMB_CFG.radius && !lineBlocked(b.x, b.z, player.x, player.z))
            damagePlayer(BOMB_CFG.playerDamage, b.x, b.z, 12, { type:'explosion' });   // pega o próprio jogador
    }
    for(const o of destructibles){
        if(o.dead || o.zone !== b.zone) continue;
        if((o.elev || 0) !== (b.elev || 0)) continue;                 // V34: chão x alto do relevo
        if(Math.hypot(o.x - b.x, o.z - b.z) <= BOMB_CFG.radius && !lineBlocked(b.x, b.z, o.x, o.z)
           && typeof o.onBombHit === 'function') o.onBombHit(b);
    }
}
function updateBombs(dt){
    if(!bombs.length) return;
    for(const b of bombs){
        if(b.exploded) continue;
        b.t += dt;
        if(b.t >= BOMB_CFG.fuse){ explodeBomb(b); b.exploded = true; }
    }
    bombs = bombs.filter(b => !b.exploded);
}

// ── ARCO / FLECHA ──────────────────────────────────────────────────────
function fireArrow(){
    if(!player.hasBow) return;
    const am = getAmmo('arrow');
    if(!am || am.count <= 0){ showToast('Sem flechas.'); return; }
    am.count -= 1;
    const a = player.angle;
    arrows.push({
        x: player.x + Math.cos(a) * 16, z: player.z - 14 + Math.sin(a) * 16,
        dirX: Math.cos(a), dirZ: Math.sin(a), t: 0,
        elev: (zone === 'overworld' && player.onPlateau) ? PLATEAU.elev : 0, zone: zone, dead: false
    });
}
function updateArrows(dt){
    if(!arrows.length) return;
    for(const p of arrows){
        if(p.dead) continue;
        p.t += dt;
        const nx = p.x + p.dirX * ARROW_CFG.speed, nz = p.z + p.dirZ * ARROW_CFG.speed;
        if(isSolidAt(nx, nz)){ p.dead = true; continue; }            // some ao bater na parede
        p.x = nx; p.z = nz;
        if(p.t >= ARROW_CFG.life){ p.dead = true; continue; }
        for(const en of enemies){
            if(en.dead || en.hp <= 0) continue;
            if(en.zoneName && en.zoneName !== p.zone) continue;
            if(Math.hypot(en.x - p.x, en.z - p.z) < HITBOXES.arrow.hit){
                const dmg = en.arrowLethal ? (en.maxHp || 999) : ARROW_CFG.damage;
                const ang = Math.atan2(en.z - p.z, en.x - p.x);
                enemyTakeDamage(en, dmg, { type:'arrow', kbAng:ang, kb:6, kbFrames:8, freeze:2 });
                p.dead = true;                                       // sem perfuração
                break;
            }
        }
    }
    arrows = arrows.filter(p => !p.dead);
}

// ── PEDRA DO OCTOROK ───────────────────────────────────────────────────
function spawnRock(o){
    const v = DIR4_VEC[o.dir];
    rocks.push({
        x: o.x + v[0] * 14, z: o.z - 10 + v[1] * 14,
        vx: v[0] * ROCK_CFG.speed, vz: v[1] * ROCK_CFG.speed,
        t: 0, dead: false, zone: zone, dmg: o.damage, spin: 0,
        type: 'physical'                                     // V33: bloqueável pelo escudo inicial
    });
}
function updateRocks(dt){
    if(!rocks.length) return;
    for(const p of rocks){
        if(p.dead) continue;
        p.t += dt; p.spin += dt * 14;
        const nx = p.x + p.vx, nz = p.z + p.vz;
        if(isSolidAt(nx, nz)){ p.dead = true; continue; }
        p.x = nx; p.z = nz;
        if(p.t >= ROCK_CFG.life){ p.dead = true; continue; }

        // V33: escudo direcional — bloqueada, a pedra só é destruída (sem reflexão)
        if(resolveEnemyProjectile(p, HITBOXES.rock, p.dmg, 5)){ p.dead = true; continue; }
    }
    rocks = rocks.filter(p => !p.dead);
}

// ── OCTOROK ────────────────────────────────────────────────────────────
function octorokLineOfSight(o){
    const dx = player.x - o.x, dz = player.z - o.z;
    const range = OCTOROK_CFG[o.variant].losRange, align = 22;
    let dir = null;
    if(Math.abs(dz) < align && Math.abs(dx) < range) dir = dx > 0 ? 'right' : 'left';
    else if(Math.abs(dx) < align && Math.abs(dz) < range) dir = dz > 0 ? 'down' : 'up';
    if(!dir || lineBlocked(o.x, o.z, player.x, player.z)) return null;
    return dir;
}
function updateOctorok(o, dt){
    if(o.dead) return;
    if(o.flash > 0) o.flash--;
    if(o.stunT > 0) o.stunT -= dt;
    if(o.knockback > 0){ o.x += o.kbX; o.z += o.kbZ; o.kbX *= 0.82; o.kbZ *= 0.82; o.knockback--; return; }
    if(o.fireCd > 0) o.fireCd -= dt;

    // rajada dupla (Octorok Azul)
    if(o.burst > 0){
        o.burstT -= dt;
        if(o.burstT <= 0){ spawnRock(o); o.burst--; o.burstT = OCTOROK_CFG.blue.doubleGap; }
        return;
    }

    if(o.state === 'walk'){
        const v = DIR4_VEC[o.dir];
        const nx = o.x + v[0] * o.speed, nz = o.z + v[1] * o.speed;
        if(isSolidAt(nx, nz) || Math.hypot(nx - o.spawnX, nz - o.spawnZ) > 230)
            o.dir = ['up','down','left','right'][Math.floor(Math.random() * 4)];
        else { o.x = nx; o.z = nz; }
        o.stateT -= dt;
        if(o.stateT <= 0){ o.state = 'pause'; o.stateT = 0.5; }
    } else {
        o.stateT -= dt;
        if(o.stateT <= 0){
            const c = OCTOROK_CFG[o.variant];
            const losDir = octorokLineOfSight(o);
            if(losDir && o.fireCd <= 0){
                o.dir = losDir; o.fireCd = 2.2;
                spawnRock(o);
                if(c.shots > 1){ o.burst = c.shots - 1; o.burstT = c.doubleGap; }
            } else if(Math.random() < 0.55){
                const dx = player.x - o.x, dz = player.z - o.z;
                o.dir = Math.abs(dx) > Math.abs(dz) ? (dx > 0 ? 'right' : 'left') : (dz > 0 ? 'down' : 'up');
            } else {
                o.dir = ['up','down','left','right'][Math.floor(Math.random() * 4)];
            }
            o.state = 'walk'; o.stateT = 2 + Math.random();
        }
    }
    if(o.stunT <= 0 && Math.hypot(player.x - o.x, player.z - o.z) < HITBOXES.octorok.touch){
        damagePlayer(o.damage, o.x, o.z, 4, { type:'physical' });
    }
    pushOutOfPlateau(o);
}

// ── SPEAR MOBLIN ───────────────────────────────────────────────────────
function moblinSeesPlayer(m){
    const dx = player.x - m.x, dz = player.z - m.z;
    if(Math.hypot(dx, dz) > MOBLIN_VISION.range()) return false;
    let diff = Math.atan2(dz, dx) - m.face;
    while(diff > Math.PI) diff -= Math.PI * 2; while(diff < -Math.PI) diff += Math.PI * 2;
    if(Math.abs(diff) > MOBLIN_VISION.halfAngle) return false;
    return !lineBlocked(m.x, m.z, player.x, player.z);
}
function updateMoblin(m, dt){
    if(m.dead) return;
    if(m.flash > 0) m.flash--;
    if(m.knockback > 0){ m.x += m.kbX; m.z += m.kbZ; m.kbX *= 0.85; m.kbZ *= 0.85; m.knockback--; }

    if(m.state === 'patrol'){
        m.invulnerable = false; m.swordImmune = false;
        const tgt = m.patrolTarget === 'A' ? m.patrolA : m.patrolB;
        const dx = tgt.x - m.x, dz = tgt.z - m.z;
        if(Math.hypot(dx, dz) < 6) m.patrolTarget = m.patrolTarget === 'A' ? 'B' : 'A';
        else { m.face = Math.atan2(dz, dx); m.x += Math.cos(m.face) * m.speed * 0.6; m.z += Math.sin(m.face) * m.speed * 0.6; }
        if(moblinSeesPlayer(m)){ m.state = 'alert'; m.stateT = 0.3; playSound('moblin_alert'); showToast(m.name + ' avistou você!'); }
    } else if(m.state === 'alert'){
        m.face = Math.atan2(player.z - m.z, player.x - m.x);
        m.stateT -= dt;
        if(m.stateT <= 0){
            m.state = 'charge'; m.stateT = 0; m.hitDone = false;
            m.chargeDX = Math.cos(m.face); m.chargeDZ = Math.sin(m.face);
        }
    } else if(m.state === 'charge'){
        m.stateT += dt;
        if(m.homing > 0 && !m.hitDone){
            let cur = Math.atan2(m.chargeDZ, m.chargeDX);
            let diff = Math.atan2(player.z - m.z, player.x - m.x) - cur;
            while(diff > Math.PI) diff -= Math.PI * 2; while(diff < -Math.PI) diff += Math.PI * 2;
            cur += Math.max(-m.homing, Math.min(m.homing, diff));
            m.chargeDX = Math.cos(cur); m.chargeDZ = Math.sin(cur);
        }
        m.face = Math.atan2(m.chargeDZ, m.chargeDX);
        const L = HITBOXES.spear_moblin.spearLen;
        const nx = m.x + m.chargeDX * m.chargeSpd, nz = m.z + m.chargeDZ * m.chargeSpd;
        if(isSolidAt(nx, nz) || isSolidAt(nx + m.chargeDX * L, nz + m.chargeDZ * L)){
            m.state = 'stunned'; m.stateT = 1.0;                     // §24: bateu na parede → atordoado
            spawnEffect('hit', m.x + m.chargeDX * 24, m.z + m.chargeDZ * 24, { elev:0 });
        } else {
            m.x = nx; m.z = nz;
            const sx = m.x + m.chargeDX * L, sz = m.z + m.chargeDZ * L;
            if(!m.hitDone && Math.hypot(player.x - sx, player.z - sz) < HITBOXES.spear_moblin.spearW){
                m.hitDone = true;
                const blocked = damagePlayer(m.damage, m.x, m.z, 14, { type:'physical' });
                if(blocked){                                         // §27: bloqueou, mas empurrão forte
                    const a = Math.atan2(player.z - m.z, player.x - m.x);
                    player.kbX = Math.cos(a) * 20; player.kbZ = Math.sin(a) * 20; player.knockback = 12;
                }
            }
            if(m.stateT > 0.95){ m.state = 'recover'; m.stateT = 0; }
        }
    } else if(m.state === 'stunned'){
        m.stateT -= dt;
        if(m.stateT <= 0){ m.state = 'recover'; m.stateT = 0; }
    } else {
        m.stateT += dt;
        if(m.stateT > 0.4) m.state = 'patrol';
    }
    pushOutOfPlateau(m);
}
function moblinAnimState(m){
    if(m.dead || m.hp <= 0) return 'death';
    if(m.state === 'stunned') return 'stun';
    if(m.state === 'charge')  return 'charge';
    if(m.state === 'alert')   return 'alert';
    if(m.state === 'patrol')  return 'walk';
    return 'idle';
}
function octorokAnimState(o){
    if(o.dead || o.hp <= 0) return 'death';
    if(o.stunT > 0) return 'hurt';
    if(o.burst > 0) return 'shoot';
    return o.state === 'walk' ? 'walk' : 'idle';
}

// ── BUMERANGUE (base única, config-driven) ──────────────────
function throwBoomerang(id){
    const cfg = BOOMERANG_CFG[id];
    if(!cfg) return;
    const a = player.angle;
    boomerang.active = true;
    boomerang.id = id;
    boomerang.cfg = cfg;
    boomerang.x = player.x;
    boomerang.z = player.z - 18;
    boomerang.dirX = Math.cos(a);
    boomerang.dirZ = Math.sin(a);
    boomerang.speed = cfg.speed;
    boomerang.dist = 0;
    boomerang.maxDist = boomerangMaxDist(id);
    boomerang.returning = false;
    boomerang.spin = 0;
    boomerang.hitEnemies = [];
}
function updateBoomerang(dt){
    if(boomerangCd > 0) boomerangCd -= dt;
    if(!boomerang.active) return;
    const cfg = boomerang.cfg;
    boomerang.spin += dt * 22;
    const step = boomerang.speed;

    if(!boomerang.returning){
        // Bumerangue Mágico: curva a trajetória enquanto o ataque está pressionado
        if(cfg.control && boomerangControlHeld){
            let ix=0, iz=0;
            if(keys['KeyW']) iz-=1;
            if(keys['KeyS']) iz+=1;
            if(keys['KeyA']) ix-=1;
            if(keys['KeyD']) ix+=1;
            if(Math.hypot(joyData.x, joyData.y) > 8){ ix = joyData.x/55; iz = joyData.y/55; }
            if(Math.hypot(ix, iz) > 0.2){
                const cur = Math.atan2(boomerang.dirZ, boomerang.dirX);
                let want = Math.atan2(iz, ix);
                let d = want - cur; while(d>Math.PI) d-=2*Math.PI; while(d<-Math.PI) d+=2*Math.PI;
                const maxTurn = cfg.turnRate * Math.PI * (dt*60);   // gradual, não instantâneo
                d = Math.max(-maxTurn, Math.min(maxTurn, d));
                const na = cur + d;
                boomerang.dirX = Math.cos(na); boomerang.dirZ = Math.sin(na);
            }
        }
        const nx = boomerang.x + boomerang.dirX*step;
        const nz = boomerang.z + boomerang.dirZ*step;
        if(isSolidAt(nx, nz)){
            boomerang.returning = true;               // bateu em obstáculo → volta imediatamente
        } else {
            boomerang.x = nx; boomerang.z = nz;
            boomerang.dist += step;
            if(boomerang.dist >= boomerang.maxDist) boomerang.returning = true;
        }
    } else {
        // retorno: mira sempre no jogador (permite "pegar de volta")
        const a = Math.atan2(player.z - boomerang.z, player.x - boomerang.x);
        boomerang.dirX = Math.cos(a); boomerang.dirZ = Math.sin(a);
        boomerang.x += boomerang.dirX*step;
        boomerang.z += boomerang.dirZ*step;
        if(Math.hypot(player.x - boomerang.x, player.z - boomerang.z) < 30){
            boomerang.active = false;
            boomerangCd = 0.15;                       // pequeno respiro antes de rearremessar
        }
    }
    boomerangHitCheck();
}
function boomerangHitCheck(){
    if(!boomerang.active) return;
    const cfg = boomerang.cfg;
    for(const en of enemies){
        if(en.dead || en.hp<=0) continue;
        if(en.zoneName && en.zoneName !== zone) continue;
        if(boomerang.hitEnemies.indexOf(en) !== -1) continue;
        if(Math.hypot(boomerang.x - en.x, boomerang.z - en.z) < HITBOXES.boomerang.radius){
            const ang = Math.atan2(en.z - boomerang.z, en.x - boomerang.x);
            // dano + "paralisar inimigos fracos" (stun) pelo sistema central
            enemyTakeDamage(en, cfg.dmg, { type:'boomerang', stunMs:cfg.stunMs,
                kbAng:ang, kb:6, kbFrames:8, freeze:2 });
            boomerang.hitEnemies.push(en);
        }
    }
    // FUTURO: aqui também dá pra checar interruptores / objetos interativos / grama
    // (boomerang.x, boomerang.z) sem mudar o resto do sistema.
}
