function gameLoop() {
    if (paused) return;
    if (freezeFrames>0){freezeFrames--;requestAnimationFrame(gameLoop);return;}
    const dt=Math.min((Date.now()-lastTime)/1000,0.1);
    lastTime=Date.now();

    // Diálogo aberto: congela a ação, mas ainda lê o gamepad (avançar a fala)
    if(dialog.active){ Gamepad.poll(); draw(); requestAnimationFrame(gameLoop); return; }

    // Timer da carga do ataque pesado
    if(heavyCharge.active){ heavyCharge.t+=dt; }
    if(caveTransitionCd>0){ caveTransitionCd-=dt; }

    // Input de ataque unificado: segurou além do limiar → começa a carregar o pesado
    if(attackInput.active){
        attackInput.t += dt;
        if(attackInput.t >= CHARGE_START_DELAY && !heavyCharge.active) startHeavyCharge();
    }

    if(player.liftT>0) player.liftT = Math.max(0, player.liftT - dt);   // V34: levantando o vaso

    // Roll / esquiva: duração curta + cooldown
    if(player.rollCd>0) player.rollCd -= dt;
    if(player.rolling){
        player.rollT -= dt;
        if(player.rollT <= 0){
            player.rolling = false; player.rollT = 0;
            // volta ao estado normal com um resíduo pequeno de velocidade na direção do roll
            player.vx = player.rollDirX * player.speed * 0.5;
            player.vz = player.rollDirZ * player.speed * 0.5;
        }
    }

    // ── Entrada de movimento: teclado + joystick virtual + GAMEPAD (fontes
    //    que se somam; a última que estiver ativa vence). O gamepad é polado
    //    aqui (uma vez por frame) — é ele que também despacha os comandos de
    //    botão do controle para o Command System. ──
    const gm = Gamepad.poll();
    let ix=0,iz=0;
    // V29: as SETAS não movem mais o personagem (ficaram só para navegar menus).
    if(keys['KeyW']) iz-=1;
    if(keys['KeyS']) iz+=1;
    if(keys['KeyA']) ix-=1;
    if(keys['KeyD']) ix+=1;
    if(Math.hypot(joyData.x,joyData.y)>8){ix=joyData.x/55;iz=joyData.y/55;}
    if(Math.hypot(gm.x,gm.y)>GAMEPAD_DEADZONE){ix=gm.x;iz=gm.y;}

    // ── Defesa / escudo — acionada pelo slot com o escudo (blockHeld) ────────
    const wantBlock = player.hasShield && !player.isAttacking && !heavyCharge.active && !player.rolling && !player.carrying
                      && blockHeld;
    player.blocking = wantBlock;
    if(blockFx>0) blockFx--;
    Effects.update(dt);
    if(toast.t>0)  toast.t-=dt;

    const mv=(Math.hypot(ix,iz)>0.08);
    const sp=(keys[keyBindings.sprint]||(btns.sprint&&btns.sprint.classList.contains('active-btn'))||gpSprintHeld)&&stamina>0&&!player.blocking&&!player.carrying;
    const carryMult = player.carrying ? CARRY_CFG.speedMult : 1;   // V34: carregando vaso
    const ts=mv?(sp?player.sprintSpeed:player.speed)*(player.blocking?0.42:1)*carryMult:0;
    if(mv && !player.rolling) player.angle=Math.atan2(iz,ix);   // durante o roll a direção fica travada

    const ac=player.isAttacking?0.14:(sp?0.30:(mv?0.13:0.17));
    player.vx=player.vx*(1-ac)+(mv?Math.cos(player.angle)*ts:0)*ac;
    player.vz=player.vz*(1-ac)+(mv?Math.sin(player.angle)*ts:0)*ac;

    // Se não está mais correndo (estamina acabou ou soltou o sprint), trava a
    // velocidade no limite da caminhada na hora, sem deixar o impulso da corrida continuar
    if(!sp && !player.isAttacking && player.knockback<=0){
        const curSpeed = Math.hypot(player.vx, player.vz);
        const capSpeed = player.speed*(player.blocking?0.42:1)*carryMult;
        if(curSpeed > capSpeed){
            const scale = capSpeed / curSpeed;
            player.vx *= scale;
            player.vz *= scale;
        }
    }

    if(player.knockback>0){
        player.x+=player.kbX;player.z+=player.kbZ;
        player.kbX*=0.86;player.kbZ*=0.86;player.knockback--;
    }else if(player.rolling){
        // avanço curto e controlado, desacelerando levemente até o fim do roll
        const k=Math.max(0,player.rollT/ROLL_DURATION);
        const spd=ROLL_SPEED*(0.55+0.45*k);
        player.x+=player.rollDirX*spd;
        player.z+=player.rollDirZ*spd;
    }else{player.x+=player.vx;player.z+=player.vz;}

    player.y+=player.velY;player.velY-=0.85;
    if(player.y<0){player.y=0;player.velY=0;}

    stamina=Math.max(0,Math.min(100,(sp&&mv)?stamina-31*dt:stamina+25*dt));

    if(rollFxTimer>0) rollFxTimer--;
    const staminaUITarget = ((sp&&mv)||rollFxTimer>0) ? 1 : 0;
    const fadeRate = staminaUITarget>staminaUIAlpha ? 0.4 : 0.065; // aparece rápido, some devagar de forma equilibrada
    staminaUIAlpha += (staminaUITarget-staminaUIAlpha)*fadeRate;
    if (Math.abs(staminaUITarget-staminaUIAlpha)<0.01) staminaUIAlpha = staminaUITarget;

    if(zone==='overworld' && !enemy.dead && enemy.hp>0){
        const dx=player.x-enemy.x,dz=player.z-enemy.z,dist=Math.hypot(dx,dz);
        const visRange=260,fadeRange=90;
        enemy.barAlpha = enemy.hasBeenHit ? Math.max(0,Math.min(1,1-(dist-visRange)/fadeRange)) : 0;
        if(enemy.knockback>0){
            enemy.x+=enemy.kbX;enemy.z+=enemy.kbZ;
            enemy.kbX*=0.84;enemy.kbZ*=0.84;enemy.knockback--;
        }else if(enemy.stunT>0){
            enemy.stunT-=dt; enemy.vx*=0.85; enemy.vz*=0.85;   // paralisado (ex.: bumerangue)
        }else if(dist<48&&enemy.attackCooldown<=0&&!player.onPlateau){
            const a=Math.atan2(player.z-enemy.z,player.x-enemy.x);
            enemy.atkAngle=a;
            enemy.attacking=18;enemy.attackCooldown=1.9;
            enemy.vx=Math.cos(a)*7;enemy.vz=Math.sin(a)*7;
            damagePlayer(enemy.damage, enemy.x, enemy.z, 5, { type:'physical' });   // dano central do inimigo
        }else if(dist<200&&!player.onPlateau){
            const ta=Math.atan2(dz,dx),ea=0.15;
            enemy.vx=enemy.vx*(1-ea)+Math.cos(ta)*enemy.speed*ea;
            enemy.vz=enemy.vz*(1-ea)+Math.sin(ta)*enemy.speed*ea;
        }else{enemy.vx*=0.82;enemy.vz*=0.82;}
        enemy.x+=enemy.vx;enemy.z+=enemy.vz;
        pushOutOfPlateau(enemy);

        const minDist=46;
        const odx=enemy.x-player.x, odz=enemy.z-player.z;
        const odist=Math.hypot(odx,odz);
        if(odist<minDist && !player.onPlateau){
            const nx = odist>0.001 ? odx/odist : 1;
            const nz = odist>0.001 ? odz/odist : 0;
            const push=(minDist-odist);
            enemy.x += nx*push*0.65;
            enemy.z += nz*push*0.65;
            player.x -= nx*push*0.35;
            player.z -= nz*push*0.35;
        }

        if(enemy.attacking>0)enemy.attacking--;
        enemy.attackCooldown=Math.max(0,enemy.attackCooldown-dt);
    }

    // Baús e itens NÃO abrem/coletam mais por proximidade — quem executa é o
    // jogador ao confirmar (InteractionManager, mais abaixo).

    if(zone==='overworld') updateBird(dt);
    if(zone==='overworld') updateSeedShooter(dt);
    if(zone==='overworld'){                       // V31 — novos inimigos terrestres
        updateOctorok(octorokRed, dt);
        updateOctorok(octorokBlue, dt);
        updateMoblin(moblinRed, dt);
        updateMoblin(moblinBlue, dt);
    }
    updateEnemyDeaths(dt);     // anim de morte → efeito pós-morte (sequência)
    updateSeeds(dt);           // projéteis funcionam em qualquer cenário
    updateBoomerang(dt);       // idem
    updateBombs(dt);           // V31 — pavio + explosão em área
    updateArrows(dt);          // V31 — flechas
    updateRocks(dt);           // V31 — pedras do Octorok
    updateThrownObjects(dt);   // V34 — vasos arremessados

    // ── Relevo + transições da caverna ───────────────────────
    if(zone==='overworld'){
        updatePlateau();
    }else{
        player.x=Math.max(CAVE_ROOM.minX+18,Math.min(CAVE_ROOM.maxX-18,player.x));
        player.z=Math.max(CAVE_ROOM.minZ+18,Math.min(CAVE_ROOM.maxZ-18,player.z));
        if(caveTransitionCd<=0 && player.z>=CAVE_ROOM.maxZ-22 && Math.abs(player.x-2000)<32) exitCave();
    }

    updateDestructibles();     // V34 — colisão dos objetos sólidos + piscada de impacto

    // ── Interação contextual: acha o alvo por perto e faz o fade do indicador ──
    InteractionManager.update(dt);

    player.hp=Math.max(0,Math.min(player.maxHp,player.hp));   // nunca negativa, nunca acima do máximo
    camera.x+=(player.x-camera.x)*0.13;
    camera.y+=(player.z-camera.y)*0.13;

    // ── Camada de apresentação: mecânica → estado → animação ──
    player.state = computePlayerState();
    AnimationManager.update(player, 'player', player.state, dt);
    if(zone==='overworld'){
        AnimationManager.update(enemy,       'goblin',       goblinAnimState(),      dt);
        AnimationManager.update(bird,        'bird',         birdAnimState(),        dt);
        AnimationManager.update(seedShooter, 'seed_shooter', seedShooterAnimState(), dt);
        AnimationManager.update(octorokRed,  'octorok',      octorokAnimState(octorokRed),  dt);
        AnimationManager.update(octorokBlue, 'octorok',      octorokAnimState(octorokBlue), dt);
        AnimationManager.update(moblinRed,   'spear_moblin', moblinAnimState(moblinRed),    dt);
        AnimationManager.update(moblinBlue,  'spear_moblin', moblinAnimState(moblinBlue),   dt);
    }

    draw();

    if (player.hp<=0 && !gameOver) {
        gameOver=true;
        showDeathScreen();
        return;
    }

    requestAnimationFrame(gameLoop);
}

// ── HUD: CORAÇÕES (V26) ─────────────────────────────────────
// Desenhados no canvas em coordenadas de tela (fora da câmera), então ficam
// fixos, acompanham a resolução e atualizam na hora em que player.hp muda.
// Cada coração tem HEART.quarters quartos e representa 5 estados:
// cheio (4/4), 3/4, 2/4, 1/4 e vazio (0/4). Aumentar HEART.max cria mais.
function heartPath(x, y, s){
    const cx = x + s/2;
    ctx.beginPath();
    ctx.moveTo(cx, y + s*0.95);
    ctx.bezierCurveTo(cx - s*0.62, y + s*0.42, cx - s*0.46, y - s*0.04, cx, y + s*0.28);
    ctx.bezierCurveTo(cx + s*0.46, y - s*0.04, cx + s*0.62, y + s*0.42, cx, y + s*0.95);
    ctx.closePath();
}
function drawHearts(){
    const s = 30, gap = 7, x0 = 20, y0 = 18;
    const q = HEART.quarters;
    for(let i = 0; i < HEART.max; i++){
        const hx = x0 + i*(s + gap);
        const heartHp = Math.max(0, Math.min(q, player.hp - i*q));
        let frac;
        if(heartHp <= 0)      frac = 0;
        else if(heartHp >= q) frac = 1;
        else                  frac = Math.min(q - 1, Math.max(1, Math.round(heartHp))) / q;

        ctx.save();
        // base (coração vazio)
        heartPath(hx, y0, s);
        ctx.fillStyle = 'rgba(10,6,10,0.66)';
        ctx.fill();
        // preenchimento proporcional aos quartos restantes
        if(frac > 0){
            ctx.save();
            ctx.beginPath();
            ctx.rect(hx - 2, y0 - 2, s*frac + (frac >= 1 ? 3 : 0.5), s + 4);
            ctx.clip();
            heartPath(hx, y0, s);
            const g = ctx.createLinearGradient(hx, y0, hx, y0 + s);
            g.addColorStop(0, '#ff6b81');
            g.addColorStop(1, '#e11d48');
            ctx.fillStyle = g;
            ctx.fill();
            ctx.restore();
        }
        // contorno + brilho
        heartPath(hx, y0, s);
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(hx + s*0.34, y0 + s*0.32, s*0.09, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fill();
        ctx.restore();
    }
}

// ── HUD: RÚPIAS (V31) ──────────────────────────────────────
// Canto inferior direito, logo acima do botão de Pause. Valor sempre com 3
// dígitos (000..999). Ícone: assets/ui/rupees/rupee_green.png (fallback = losango).
const RUPEE_HUD_SRC = 'assets/ui/rupees/rupee_green.png';
const rupeeHudImg = { img: new Image(), ready: false };
rupeeHudImg.img.onload  = () => { rupeeHudImg.ready = rupeeHudImg.img.naturalWidth > 0; };
rupeeHudImg.img.onerror = () => { rupeeHudImg.ready = false; };
rupeeHudImg.img.src = RUPEE_HUD_SRC + '?t=' + Date.now();
function drawRupeeHud(){
    const val = String(Math.max(0, Math.min(RUPEE_MAX, player.rupees || 0))).padStart(3, '0');
    const iconS = 22;
    const padR = 18, padB = 74;                       // 74 ≈ acima do #btn-pause (44) + margem
    ctx.save();
    ctx.font = 'bold 20px Segoe UI';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    const textW = ctx.measureText(val).width;
    const rx = canvas.width - padR;
    const ry = canvas.height - padB;
    // fundo discreto
    ctx.fillStyle = 'rgba(8,10,20,0.55)';
    roundRect(rx - textW - iconS - 20, ry - 17, textW + iconS + 28, 34, 9);
    ctx.fill();
    // ícone
    const ix = rx - textW - iconS - 6;
    if(rupeeHudImg.ready){
        const ih = iconS, iw = rupeeHudImg.img.naturalWidth * (ih / rupeeHudImg.img.naturalHeight);
        ctx.drawImage(rupeeHudImg.img, ix - iw / 2 + iconS / 2, ry - ih / 2, iw, ih);
    } else {
        ctx.fillStyle = RUPEE_TYPES.green_rupee.tint;
        ctx.strokeStyle = 'rgba(255,255,255,0.85)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(ix + iconS/2, ry - 11); ctx.lineTo(ix + iconS/2 + 7, ry - 4);
        ctx.lineTo(ix + iconS/2 + 7, ry + 4); ctx.lineTo(ix + iconS/2, ry + 11);
        ctx.lineTo(ix + iconS/2 - 7, ry + 4); ctx.lineTo(ix + iconS/2 - 7, ry - 4);
        ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    // valor
    ctx.fillStyle = '#f4e9c9';
    ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 4;
    ctx.fillText(val, rx, ry + 1);
    ctx.restore();
}

// ── INVENTÁRIO: navegação e render (V26) ────────────────────
function showPauseView(v){
    if(!paused) return;
    iamClose();                       // V30: nunca deixa a mini-janela aberta ao trocar de tela
    pauseView = v;
    const inv = (v === 'inventory');
    document.getElementById('pause-screen').style.display     = inv ? 'none' : 'flex';
    document.getElementById('inventory-screen').style.display = inv ? 'flex' : 'none';
    if(inv){ invSel = 0; renderInventory(); }
}
function invSectionOf(entry){ return isWeaponCat(entry) ? 'weapons' : 'items'; }
function ownedByType(section){
    return ownedEquipment().filter(e => (section === 'weapons') === isWeaponCat(e));
}
function slotHolding(id){ return SLOT_NAMES.find(s => equipmentSlots[s] === id) || null; }

function moveInvSelection(d){
    const n = flatOwned().length;
    if(n === 0) return;
    invSel = (invSel + d + n) % n;
    renderInventory();
}
// Enter/"Usar": poção → consome; arma/escudo → garante que está num slot
// (usa o slot natural se ainda não estiver equipada em lugar nenhum).
function confirmInvSelection(){
    const entry = currentInvEntry();
    if(!entry) return;
    if(entry.type === 'consumable'){
        if(useConsumable(getPotion(entry.id))) renderInventory();
        return;
    }
    let slot = slotHolding(entry.id);
    if(!slot){
        slot = DEFAULT_SLOT[entry.id] || 'right';
        assignToSlot(entry.id, slot);
    }
    if(entry.type === 'weapon'){ equippedWeapon = entry.id; attackInput.active = false; attackInput.t = 0; }
    renderInventory();
}
// Atribui o item selecionado (ou o passado) a um dos 4 slots.
function assignSelectedToSlot(slot, entry){
    entry = entry || currentInvEntry();
    if(!entry || SLOT_NAMES.indexOf(slot) === -1) return;
    assignToSlot(entry.id, slot);
    if(entry.type === 'weapon') equippedWeapon = entry.id;
    renderInventory();
    showToast(entry.name + ' → slot ' + SLOT_LETTER[slot]);
}
function renderInventory(){
    const flat = flatOwned();
    if(invSel >= flat.length) invSel = Math.max(0, flat.length - 1);
    let gi = 0;
    [['weapons','inv-weapons'], ['items','inv-items']].forEach(([section, elId]) => {
        const el = document.getElementById(elId);
        el.innerHTML = '';
        const owned = ownedByType(section);
        if(owned.length === 0){
            const d = document.createElement('div');
            d.className = 'inv-slot inv-empty';
            d.textContent = 'Vazio';
            el.appendChild(d);
            return;
        }
        owned.forEach(entry => {
            const myIndex = gi++;
            const heldSlot = slotHolding(entry.id);
            const isConsum = (entry.type === 'consumable');
            const hasQty   = isConsum || entry.type === 'ammunition';   // V31: flechas mostram x N
            const slot = document.createElement('div');
            slot.className = 'inv-slot'
                + (myIndex === invSel ? ' selected' : '')
                + (heldSlot ? ' equipped' : '')
                + (isConsum ? ' consumable ' + (entry.color||'') : '');
            slot.innerHTML =
                (heldSlot ? '<span class="inv-slotbadge">' + SLOT_LETTER[heldSlot] + '</span>' : '') +
                '<span class="inv-icon">' + entry.icon + '</span>' +
                '<span class="inv-label">' + entry.name + '</span>' +
                (hasQty ? '<span class="inv-qty">x' + entry.quantity + '</span>' : '');
            slot.addEventListener('click', () => { invSel = myIndex; iamOpenFor(entry.id); });
            el.appendChild(slot);
        });
    });
    updateInvDetail();
    if(uiNavReady) UINav.refresh();   // V29: o DOM do inventário mudou → reconstrói o anel de foco
}
function updateInvDetail(){
    const nameEl = document.getElementById('inv-detail-name');
    const descEl = document.getElementById('inv-detail-desc');
    const eqBtn  = document.getElementById('btn-inv-equip');
    const entry  = currentInvEntry();
    const slotBtns = document.querySelectorAll('#inv-slot-row .inv-slot-btn');
    if(!entry){
        nameEl.textContent = '—';
        descEl.textContent = 'Nenhum equipamento coletado ainda.';
        eqBtn.disabled = true; eqBtn.textContent = 'Usar';
        slotBtns.forEach(b => { b.disabled = true; b.classList.remove('here'); });
        return;
    }
    nameEl.textContent = entry.name;
    descEl.textContent = entry.desc;
    const heldSlot = slotHolding(entry.id);
    slotBtns.forEach(b => {
        b.disabled = false;
        b.classList.toggle('here', b.dataset.slot === heldSlot);
    });
    if(entry.type === 'consumable'){
        eqBtn.textContent = 'Usar';
        eqBtn.disabled = (entry.quantity <= 0) || (player.hp >= player.maxHp);
    }else{
        eqBtn.textContent = heldSlot ? ('No slot ' + SLOT_LETTER[heldSlot]) : 'Equipar';
        eqBtn.disabled = !!heldSlot;
    }
}

/* ═══════════════════════════════════════════════════════════════════════════
   ItemActionMenu (V30) — mini-janela contextual reaproveitável
   ───────────────────────────────────────────────────────────────────────────
   Uma única estrutura para TODOS os tipos. Recebe o id de EQUIPMENT e monta as
   opções pelo tipo:
       arma / escudo  →  EQUIPAR · LARGAR · CANCELAR
       item / poção   →  USAR · EQUIPAR · LARGAR · CANCELAR
   EQUIPAR abre a etapa 'slot' (losango I/J/K/L). LARGAR de item empilhável com
   quantidade > 1 abre a etapa 'qty' (- / valor / +). Navegação e confirmação
   reutilizam o UINav (contexto 'iam') — nada de listeners paralelos.
   ═══════════════════════════════════════════════════════════════════════════ */
const IAM = {
    open: false,
    entryId: null,
    stage: 'actions',     // 'actions' | 'slot' | 'qty'
    sel: 0,
    dropQty: 1,
    options: []           // etapa atual: [{ label, run }]
};
const IAM_SLOT_ORDER = [
    { slot:'top',    letter:'I', name:'Superior' },
    { slot:'left',   letter:'J', name:'Esquerdo' },
    { slot:'right',  letter:'L', name:'Direito'  },
    { slot:'bottom', letter:'K', name:'Inferior' }
];

function iamOpenFor(id){
    const e = EQUIPMENT[id];
    if(!e || !e.owned() || !paused || pauseView !== 'inventory') return;
    IAM.open = true; IAM.entryId = id; IAM.stage = 'actions'; IAM.sel = 0; IAM.dropQty = 1;
    iamBuildOptions();
    document.getElementById('iam').hidden = false;
    iamRender();
}
function iamClose(){
    if(!IAM.open){ const im = document.getElementById('iam'); if(im) im.hidden = true; return; }
    IAM.open = false;
    document.getElementById('iam').hidden = true;
    if(typeof renderInventory === 'function' && paused && pauseView === 'inventory') renderInventory();
    else if(uiNavReady) UINav.refresh();
}
function iamBack(){
    if(!IAM.open) return;
    if(IAM.stage === 'slot' || IAM.stage === 'qty'){
        IAM.stage = 'actions'; IAM.sel = 0; iamBuildOptions(); iamRender();
    } else {
        iamClose();
    }
}
function iamBuildOptions(){
    const e = EQUIPMENT[IAM.entryId];
    IAM.options = [];
    if(!e) return;
    const weapon = isWeaponCat(e);
    if(IAM.stage === 'actions'){
        if(e.type === 'consumable'){
            IAM.options.push({ label:'USAR', run:()=>{
                useConsumable(getPotion(IAM.entryId));   // respeita as regras do item; não consome se não puder
                renderInventory();
                iamClose();
            }});
        }
        if(isSlottable(e)){
            IAM.options.push({ label:'EQUIPAR', run:()=>{ IAM.stage = 'slot'; IAM.sel = 0; iamBuildOptions(); iamRender(); } });
        }
        IAM.options.push({ label:'LARGAR', run:()=>{
            if(entryStackCount(IAM.entryId) > 1){ IAM.stage = 'qty'; IAM.dropQty = 1; IAM.sel = 2; iamBuildOptions(); iamRender(); }
            else { iamDrop(IAM.entryId, 1); }
        }});
        IAM.options.push({ label:'CANCELAR', run:()=>iamClose() });
    } else if(IAM.stage === 'slot'){
        IAM_SLOT_ORDER.forEach(s => IAM.options.push({ label:s.letter, slot:s.slot, run:()=>iamEquipToSlot(s.slot) }));
        IAM.options.push({ label:'CANCELAR', run:()=>{ IAM.stage = 'actions'; IAM.sel = 0; iamBuildOptions(); iamRender(); } });
    } else if(IAM.stage === 'qty'){
        const max = Math.max(1, entryStackCount(IAM.entryId));
        IAM.options = [
            { label:'−', run:()=>{ IAM.dropQty = Math.max(1, IAM.dropQty - 1); iamRender(); } },
            { label:'+', run:()=>{ IAM.dropQty = Math.min(max, IAM.dropQty + 1); iamRender(); } },
            { label:'CONFIRMAR', run:()=>{ iamDrop(IAM.entryId, IAM.dropQty); } },
            { label:'CANCELAR',  run:()=>{ IAM.stage = 'actions'; IAM.sel = 0; iamBuildOptions(); iamRender(); } }
        ];
    }
    if(IAM.sel >= IAM.options.length) IAM.sel = Math.max(0, IAM.options.length - 1);
}
function iamEquipToSlot(slot){
    const id = IAM.entryId, e = EQUIPMENT[id];
    assignToSlot(id, slot);                       // já tira dos outros slots (fonte única)
    if(e && e.type === 'weapon') equippedWeapon = id;
    renderInventory();
    if(e) showToast(e.name + '  →  slot ' + SLOT_LETTER[slot]);
    iamClose();
}
function iamDrop(id, qty){
    const e = EQUIPMENT[id];
    // 1) tira dos slots (nunca deixa referência quebrada)
    for(const s of SLOT_NAMES) if(equipmentSlots[s] === id) equipmentSlots[s] = null;
    if(equippedWeapon === id){
        equippedWeapon = SLOT_NAMES.map(s => equipmentSlots[s])
                                   .find(x => { const q = EQUIPMENT[x]; return q && q.type === 'weapon' && q.owned(); }) || null;
    }
    // 2) tira da posse (fonte única: player.has* / POTIONS.quantity / AMMO.count)
    let droppedQty = 1;
    if(POSSESSION[id]){
        player[POSSESSION[id]] = false;
    } else {
        const p = getPotion(id), a = getAmmo(id);
        if(p){ droppedQty = Math.max(1, Math.min(qty || 1, p.quantity)); p.quantity = Math.max(0, p.quantity - droppedQty); }
        else if(a){ droppedQty = Math.max(1, Math.min(qty || 1, a.count)); a.count = Math.max(0, a.count - droppedQty); }
    }
    // 3) cai no mundo (coletável de novo pela interação contextual)
    dropItemInWorld(id, droppedQty);
    renderSlotHud();
    renderInventory();
    if(e) showToast(e.name + (droppedQty > 1 ? ' (x' + droppedQty + ')' : '') + ' largada no chão.');
    iamClose();
}
function iamMarkSel(){
    document.querySelectorAll('#iam-options [data-i]').forEach(b => {
        b.classList.toggle('iam-cur', Number(b.dataset.i) === IAM.sel);
    });
}
function iamRender(){
    const box = document.getElementById('iam-options');
    const e = EQUIPMENT[IAM.entryId];
    document.getElementById('iam-title').textContent = e ? e.name : '—';
    if(IAM.stage === 'slot'){
        box.innerHTML =
            '<div class="iam-hint">Escolha o slot</div>' +
            '<div class="iam-diamond">' +
            IAM_SLOT_ORDER.map((s, i) => {
                const occ = EQUIPMENT[equipmentSlots[s.slot]];
                return '<button class="iam-opt iam-slotpos pos-' + s.slot + '" data-i="' + i + '">' +
                       '<b>' + s.letter + '</b><span>' + s.name + (occ ? ' · ' + occ.icon : '') + '</span></button>';
            }).join('') +
            '</div>' +
            '<button class="iam-opt" data-i="4">CANCELAR</button>';
    } else if(IAM.stage === 'qty'){
        box.innerHTML =
            '<div class="iam-hint">Quantidade para largar</div>' +
            '<div class="iam-qtyrow">' +
                '<button class="iam-opt iam-qbtn" data-i="0">−</button>' +
                '<span class="iam-qval">' + IAM.dropQty + '</span>' +
                '<button class="iam-opt iam-qbtn" data-i="1">+</button>' +
            '</div>' +
            '<button class="iam-opt" data-i="2">CONFIRMAR</button>' +
            '<button class="iam-opt" data-i="3">CANCELAR</button>';
    } else {
        box.innerHTML = IAM.options.map((o, i) =>
            '<button class="iam-opt" data-i="' + i + '">' + o.label + '</button>').join('');
    }
    iamMarkSel();
    if(uiNavReady) UINav.refresh();
}
function iamActivate(i){
    const o = IAM.options[i];
    if(o && typeof o.run === 'function') o.run();
}
function iamMove(d){
    if(!IAM.open || !IAM.options.length) return;
    IAM.sel = (IAM.sel + d + IAM.options.length) % IAM.options.length;
    iamMarkSel();
}

/* ═══════════════════════════════════════════════════════════════════════════
   UI NAVIGATION (V29) — teclado + D-Pad + analógico esquerdo nos MENUS
   ───────────────────────────────────────────────────────────────────────────
   Um único "anel de foco" por contexto (menu inicial, CONTROLES, histórico,
   PERSONALIZAR, Pause, Inventário). O foco anda pelos itens; Enter/A confirma;
   B/ESC volta; ←/→ (ou D-Pad) trocam Pause ⇄ Inventário.

   O indicador é UMA moldura DOM (#ui-cursor, position:fixed) que desliza
   (lerp) até o retângulo do item focado — funciona igual para menus
   desenhados no canvas (coords de tela = coords do canvas, 1:1) e para as
   telas HTML (getBoundingClientRect). Glow/pulso ficam no CSS.
   ═══════════════════════════════════════════════════════════════════════════ */
// Normaliza tecla de navegação a partir de e.code E e.key (teclados/layouts
// que não preenchem e.code ainda funcionam). Só é usada nas telas de menu.
function navToken(e){
    const c = e.code || '', k = e.key || '';
    if(c==='ArrowUp'    || c==='KeyW' || k==='ArrowUp'    || k==='w' || k==='W') return 'up';
    if(c==='ArrowDown'  || c==='KeyS' || k==='ArrowDown'  || k==='s' || k==='S') return 'down';
    if(c==='ArrowLeft'  || c==='KeyA' || k==='ArrowLeft'  || k==='a' || k==='A') return 'left';
    if(c==='ArrowRight' || c==='KeyD' || k==='ArrowRight' || k==='d' || k==='D') return 'right';
    if(c==='Enter' || c==='NumpadEnter' || c==='Space' || k==='Enter' || k===' ') return 'ok';
    return null;
}
function invSlotKeyOf(e){
    const asg = { KeyI:'top', KeyJ:'left', KeyK:'bottom', KeyL:'right',
                  Digit1:'top', Digit2:'left', Digit3:'bottom', Digit4:'right' };
    if(asg[e.code]) return asg[e.code];
    const k = (e.key || '').toUpperCase();
    if('IJKL'.indexOf(k) !== -1) return asg['Key' + k];
    if('1234'.indexOf(e.key) !== -1) return asg['Digit' + e.key];
    return null;
}

const UINav = (() => {
    const cursorEl = document.getElementById('ui-cursor');
    let items = [];          // [{ rect(), activate(), focus? }]
    let sel = 0;
    let builtKey = '␀';  // contexto já montado
    let active = false;
    let onHoriz = null;      // ←/→ (quando definido, não anda no anel)
    let onBack  = null;      // B / (ESC já é tratado no keydown)
    let onPageNext = null;   // V30: RB (Pause → Inventário)
    let onPagePrev = null;   // V30: LB (Inventário → Pause)
    let navMode = 'ring';    // 'ring' = lista/coluna linear · 'grid' = navegação espacial 2D
    let shown = null;        // retângulo desenhado (interpolado)
    let snapNext = false;    // trocou de contexto → posiciona sem deslizar
    let padPrev = {};
    const axisState = { v:{ dir:0, t:0 }, h:{ dir:0, t:0 } };

    function elRect(el){
        if(!el) return null;
        const r = el.getBoundingClientRect();
        if(!r.width && !r.height) return null;
        return { x:r.left, y:r.top, w:r.width, h:r.height };
    }
    function invItemEls(){
        return Array.from(document.querySelectorAll('#inv-weapons .inv-slot, #inv-items .inv-slot'))
                    .filter(el => !el.classList.contains('inv-empty'));
    }
    function ctxKey(){
        if(screen === 'menu')      return 'menu';
        if(screen === 'controls')  return 'controls';
        if(screen === 'changelog') return 'changelog';
        if(screen === 'remap')     return 'remap:' + remapMode + ':' + (remapCapturing || '') +
                                          ':' + ((remapRowRects && remapRowRects.length) || 0);
        if(screen === 'game' && paused && !gameOver){
            if(pauseView === 'inventory'){
                if(typeof IAM !== 'undefined' && IAM.open)
                    return 'iam-' + IAM.stage + ':' + IAM.entryId + ':' + IAM.options.length + ':' + IAM.dropQty;
                return 'inv:' + invItemEls().length;
            }
            return 'pause';
        }
        if(document.getElementById('death-screen').style.display === 'flex') return 'death';
        return '';
    }

    function build(){
        const prevBase = builtKey.split(':')[0];
        const prevSel  = sel;
        const k = ctxKey();
        builtKey = k;
        items = []; onHoriz = null; onBack = null; onPageNext = null; onPagePrev = null;
        navMode = 'ring'; active = false;
        if(!k) return;
        active = true;

        const byId = id => document.getElementById(id);
        const domBtn = id => ({ rect:()=>elRect(byId(id)),
                                activate:()=>{ const b = byId(id); if(b && !b.disabled) b.click(); } });

        if(k === 'menu'){
            items = [
                { rect:()=>getMenuBtns().play,     activate:()=>startGame() },
                { rect:()=>getMenuBtns().controls, activate:()=>{ screen = 'controls'; build(); } },
                { rect:()=>{ const g = getGearBtn(); return { x:g.x-g.r, y:g.y-g.r, w:g.r*2, h:g.r*2 }; },
                  activate:()=>{ screen = 'changelog'; build(); } }
            ];
        } else if(k === 'controls'){
            items = [
                { rect:()=>controlsCustomBtn, activate:()=>{ screen = 'remap'; remapCapturing = null; remapMsg = ''; build(); } },
                { rect:()=>controlsBackBtn,   activate:()=>{ screen = 'menu'; build(); } }
            ];
            onBack = ()=>{ screen = 'menu'; build(); };
        } else if(k === 'changelog'){
            items = [ { rect:()=>changelogBackBtn, activate:()=>{ screen = 'menu'; build(); } } ];
            onBack = ()=>{ screen = 'menu'; build(); };
        } else if(k.indexOf('remap') === 0){
            items.push({ rect:()=>remapTabBtns.keyboard,
                         activate:()=>{ remapMode = 'keyboard'; remapCapturing = null; remapMsg = ''; build(); } });
            items.push({ rect:()=>remapTabBtns.gamepad,
                         activate:()=>{ remapMode = 'gamepad'; remapCapturing = null; remapMsg = ''; remapPadPrev = []; build(); } });
            (remapRowRects || []).forEach(rr => items.push({
                rect:()=>{ const m = (remapRowRects || []).find(x => x.cmd === rr.cmd); return m || rr; },
                activate:()=>{ remapCapturing = (remapCapturing === rr.cmd) ? null : rr.cmd;
                               remapMsg = ''; if(remapMode === 'gamepad') remapPadPrev = []; build(); }
            }));
            items.push({ rect:()=>remapResetBtn, activate:()=>{ resetBindings(); build(); } });
            items.push({ rect:()=>remapBackBtn,
                         activate:()=>{ screen = 'controls'; remapCapturing = null; remapMsg = ''; build(); } });
            onBack = ()=>{ if(remapCapturing){ remapCapturing = null; remapMsg = ''; } else { screen = 'controls'; } build(); };
        } else if(k === 'death'){
            items = [ domBtn('btn-restart'), domBtn('btn-menu') ];
        } else if(k === 'pause'){
            items = [ domBtn('btn-pause-resume'), domBtn('btn-pause-menu'), domBtn('btn-to-inventory') ];
            onPageNext = ()=>showPauseView('inventory');   // V30: RB abre o Inventário
            onBack     = ()=>resumeGame();
        } else if(k.indexOf('iam') === 0){
            // V30: mini-janela de ações (arma/item) — lista linear (↑↓ / ←→ percorrem as opções).
            Array.from(document.querySelectorAll('#iam-options [data-i]')).forEach((b, i) => items.push({
                rect:()=>elRect(b),
                focus:()=>{ IAM.sel = i; iamMarkSel(); },
                activate:()=>{ IAM.sel = i; iamActivate(i); }
            }));
            onBack = ()=>iamBack();
        } else if(k.indexOf('inv') === 0){
            // V30: grade de itens — ↑↓ trocam de LINHA, ←→ trocam de COLUNA (espacial).
            navMode = 'grid';
            invItemEls().forEach((el, i) => items.push({
                rect:()=>elRect(el),
                focus:()=>{
                    invSel = i;
                    try{ el.scrollIntoView({ block:'nearest', inline:'nearest' }); }catch(_){}
                    document.querySelectorAll('#inventory-screen .inv-slot.selected')
                            .forEach(s => s.classList.remove('selected'));
                    el.classList.add('selected');
                    updateInvDetail();
                },
                activate:()=>{ invSel = i; const e = flatOwned()[i]; if(e) iamOpenFor(e.id); }
            }));
            // "voltar" fica fora do anel: teclado usa ESC, controle usa LB, mouse
            // clica na seta — assim ↑ na 1ª linha não rouba o foco p/ a seta.
            onPagePrev = ()=>showPauseView('pause');   // V30: LB volta ao Pause
            onBack     = ()=>showPauseView('pause');
        }

        const base = k.split(':')[0];
        if(base === prevBase){
            sel = Math.max(0, Math.min(prevSel, items.length - 1));
        } else {
            sel = 0; snapNext = true;
            axisState.v.dir = 0; axisState.h.dir = 0;
        }
        focusCurrent();
    }

    function sync(){ if(ctxKey() !== builtKey) build(); }
    function refresh(){ build(); }
    function focusCurrent(){
        const it = items[sel];
        if(it && it.focus){ try{ it.focus(); }catch(_){} }
    }
    // Navegação ESPACIAL 2D: acha o item mais próximo na direção pedida, dando
    // forte preferência a quem está alinhado no eixo perpendicular (mesma coluna
    // p/ ↑↓, mesma linha p/ ←→). Sem nada na direção → não sai do lugar.
    function spatialStep(dir){
        if(!items.length) return;
        const cs = items.map(it => {
            const r = it && it.rect && it.rect();
            return r ? { cx:r.x + r.w/2, cy:r.y + r.h/2, w:r.w, h:r.h } : null;
        });
        const cur = cs[Math.min(sel, cs.length - 1)];
        if(!cur) return;
        const vertical = (dir === 'up' || dir === 'down');
        let best = -1, bestScore = Infinity;
        for(let i = 0; i < cs.length; i++){
            if(i === sel || !cs[i]) continue;
            const dx = cs[i].cx - cur.cx, dy = cs[i].cy - cur.cy;
            let along, perp;
            if(dir === 'up'){        if(dy >= -3) continue; along = -dy; perp = Math.abs(dx); }
            else if(dir === 'down'){ if(dy <=  3) continue; along =  dy; perp = Math.abs(dx); }
            else if(dir === 'left'){ if(dx >= -3) continue; along = -dx; perp = Math.abs(dy); }
            else {                   if(dx <=  3) continue; along =  dx; perp = Math.abs(dy); }
            // rejeita saltos diagonais. ←→ ficam presos na LINHA (limite apertado);
            // ↑↓ toleram um leve desvio de coluna p/ achar a linha vizinha.
            const lim = vertical ? Math.max(cur.w, cs[i].w) * 1.8
                                 : Math.max(cur.h, cs[i].h) * 0.9;
            if(perp > lim) continue;
            const score = along + perp * 2.4;
            if(score < bestScore){ bestScore = score; best = i; }
        }
        if(best === -1) return;      // nada nessa direção: mantém a seleção
        sel = best;
        focusCurrent();
    }
    function move(step){
        if(!active || !items.length) return;
        if(navMode === 'grid'){ spatialStep(step < 0 ? 'up' : 'down'); return; }
        sel = (sel + step + items.length) % items.length;
        focusCurrent();
    }
    function horiz(step){
        if(!active) return;
        if(onHoriz){ onHoriz(step); return; }
        if(navMode === 'grid'){ spatialStep(step < 0 ? 'left' : 'right'); return; }
        move(step);
    }
    function activate(){
        if(!active) return;
        const it = items[Math.min(sel, items.length - 1)];
        if(it && it.activate){ try{ it.activate(); }catch(_){} }
    }
    function back(){ if(active && onBack){ try{ onBack(); }catch(_){} } }

    function handleKey(e){
        if(!active) return false;
        switch(navToken(e)){
            case 'up':    move(-1);  return true;
            case 'down':  move(1);   return true;
            case 'left':  horiz(-1); return true;
            case 'right': horiz(1);  return true;
            case 'ok':    activate(); return true;
        }
        return false;
    }

    function wantsGamepad(){ return active && !(screen === 'remap' && remapCapturing); }
    function axisRepeat(kind, dir, fn){
        const st = axisState[kind], now = performance.now();
        if(dir === 0){ st.dir = 0; return; }
        if(dir !== st.dir){ st.dir = dir; st.t = now + 330; fn(dir); return; }
        if(now >= st.t){ st.t = now + 160; fn(dir); }
    }
    function pollGamepad(gp){
        const B = n => !!(gp.buttons[n] && (gp.buttons[n].pressed || gp.buttons[n].value > 0.5));
        const edge = (name, v) => { const was = !!padPrev[name]; padPrev[name] = v; return v && !was; };
        if(edge('up', B(12))) move(-1);
        if(edge('dn', B(13))) move(1);
        if(edge('lf', B(14))) horiz(-1);
        if(edge('rt', B(15))) horiz(1);
        if(edge('a',  B(0)))  activate();
        if(edge('b',  B(1)))  back();
        if(edge('rb', B(5)) && onPageNext) onPageNext();   // V30: RB → Inventário (só no Pause)
        if(edge('lb', B(4)) && onPagePrev) onPagePrev();   // V30: LB → Pause (só no Inventário)
        const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
        axisRepeat('v', ay < -0.55 ? -1 : ay > 0.55 ? 1 : 0, move);
        axisRepeat('h', ax < -0.55 ? -1 : ax > 0.55 ? 1 : 0, horiz);
    }

    function animate(){
        if(!active || !items.length){ cursorEl.classList.remove('on'); shown = null; return; }
        const it = items[Math.min(sel, items.length - 1)];
        const r = it && it.rect && it.rect();
        if(!r || !r.w){ cursorEl.classList.remove('on'); return; }
        const t = { x:r.x - 6, y:r.y - 6, w:r.w + 12, h:r.h + 12 };
        if(!shown || snapNext){ shown = { x:t.x, y:t.y, w:t.w, h:t.h }; snapNext = false; }
        else {
            const K = 0.28;
            shown.x += (t.x - shown.x) * K;
            shown.y += (t.y - shown.y) * K;
            shown.w += (t.w - shown.w) * K;
            shown.h += (t.h - shown.h) * K;
        }
        cursorEl.style.transform = 'translate(' + shown.x.toFixed(1) + 'px,' + shown.y.toFixed(1) + 'px)';
        cursorEl.style.width  = shown.w.toFixed(1) + 'px';
        cursorEl.style.height = shown.h.toFixed(1) + 'px';
        cursorEl.classList.add('on');
    }

    function _tick(){
        sync();
        if(wantsGamepad() && navigator.getGamepads){
            const gp = Array.from(navigator.getGamepads()).find(p => p);
            if(gp) pollGamepad(gp);
        }
        animate();
    }

    return { move, horiz, activate, back, handleKey, refresh, sync, wantsGamepad, _tick };
})();
uiNavReady = true;
(function uiNavLoop(){
    try{ UINav._tick(); }catch(e){}
    requestAnimationFrame(uiNavLoop);
})();

    document.getElementById('dialog-text').textContent = dialog.lines[dialog.idx] || '';
    const last = dialog.idx >= dialog.lines.length-1;
    const key = isMobileDevice() ? 'toque' : (keyLabel(keyBindings.slotRight) + ' / B');
    document.getElementById('dialog-hint').textContent = '[' + key + ']  ' + (last ? 'fechar' : 'continuar');

/* ═══════════════════════════════════════════════════════════════════════════
   INTERAÇÃO CONTEXTUAL POR PROXIMIDADE (V28)
   ───────────────────────────────────────────────────────────────────────────
   Sem tecla/botão fixo de "interagir". Um único InteractionManager:
     · registra objetos interagíveis (npc / chest / item / ...)
     · a cada frame acha o alvo prioritário no raio (mais perto, com leve
       vantagem para o que o jogador está olhando)
     · mostra o indicador (assets/ui/interaction/interaction_prompt.png) NA
       POSIÇÃO DO OBJETO (mundo→tela), com fade-in / fade-out
     · a proximidade só HABILITA; quem executa é o jogador ao confirmar
       (tecla do Slot Direito / botão B no controle / toque no indicador)
   Cada objeto define seu próprio interactionLabel e interactionRange e o que
   faz em onInteract(). Nada dessa lógica fica espalhado pelos objetos.
   ═══════════════════════════════════════════════════════════════════════════ */
const INTERACT_PROMPT = {
    src: 'assets/ui/interaction/interaction_prompt.png',
    displayH: 46,        // altura na tela (px); a largura mantém a PROPORÇÃO ORIGINAL do PNG
    lift: 70,            // px de tela acima do objeto (não encolhe com o zoom)
    pulse: 0.09,         // amplitude da "pulsada" leve ao aparecer (0 = sem pulsada)
    pulseTime: 0.30,     // duração da pulsada (s)
    // Texto da ação DENTRO da imagem: começa em xFrac da largura (align:left),
    // altura em yFrac. Ajuste fino aqui, sem tocar em mais nada.
    label: { xFrac: 0.44, yFrac: 0.52, font: 'bold 10.5px Segoe UI', color: '#15181f', align: 'left' }
};
const interactPromptImg = { img: new Image(), ready: false };
interactPromptImg.img.onload  = () => { interactPromptImg.ready = interactPromptImg.img.naturalWidth > 0; };
interactPromptImg.img.onerror = () => { interactPromptImg.ready = false; };
interactPromptImg.img.src = INTERACT_PROMPT.src + '?t=' + Date.now();   // sempre a versão atual do arquivo

const InteractionManager = (() => {
    let items  = [];
    let target = null;
    let alpha  = 0;                 // 0..1 (fade)
    let appearT = 0;               // s desde que o alvo apareceu (para a pulsada)
    let rect   = null;              // último retângulo do indicador na tela (para toque)
    const FADE_IN = 10, FADE_OUT = 2.6;   // aparece rápido, some bem mais devagar (~0.4s)

    function register(o){ items.push(o); }
    function clearAll(){ items = []; }
    function reset(){ target = null; alpha = 0; appearT = 0; rect = null; }

    function facing(o){
        const dx = o._x - player.x, dz = o._z - player.z;
        const d = Math.hypot(dx, dz) || 1;
        return (Math.cos(player.angle) * dx + Math.sin(player.angle) * dz) / d;   // -1..1
    }
    function pick(){
        let best = null, bestKey = 0;
        for(const o of items){
            if(o.available && !o.available()) continue;
            if(o.exclusive){ o._x = o.worldX(); o._z = o.worldZ(); return o; }   // V34: ex. vaso nas mãos → só arremessar
            o._x = o.worldX(); o._z = o.worldZ();
            const dist = Math.hypot(player.x - o._x, player.z - o._z);
            if(dist > (o.interactionRange || 48)) continue;
            const key = dist - Math.max(0, facing(o)) * 20;   // olhar para o objeto o "aproxima" no ranking
            if(best === null || key < bestKey){ best = o; bestKey = key; }
        }
        return best;
    }
    function update(dt){
        if(screen !== 'game' || paused){ target = null; alpha = 0; appearT = 0; return; }
        const next = dialog.active ? null : pick();
        if(next !== target){
            if(target && next) alpha = Math.min(alpha, 0.4);   // troca de alvo: refade rápido
            if(next) appearT = 0;                               // (re)inicia a pulsada
            target = next;
        }
        if(target) appearT += dt;
        const goal = target ? 1 : 0;
        if(goal > alpha) alpha = Math.min(1, alpha + FADE_IN * dt);
        else             alpha = Math.max(0, alpha - FADE_OUT * dt);
    }
    // fator de escala da pulsada leve (1.0 em repouso, sobe e volta ao aparecer)
    function pulseScale(){
        const T = INTERACT_PROMPT.pulseTime || 0.3;
        if(appearT >= T || !INTERACT_PROMPT.pulse) return 1;
        return 1 + Math.sin((appearT / T) * Math.PI) * INTERACT_PROMPT.pulse;
    }
    function hasTarget(){ return !!target && !dialog.active && !paused && screen === 'game'; }
    function currentLabel(){ return target ? (target.interactionLabel || 'INTERAGIR') : ''; }
    function confirm(){
        if(!hasTarget()) return false;
        const t = target;
        if(typeof t.onInteract === 'function') t.onInteract();
        return true;
    }
    function screenPos(){
        if(!target) return null;
        const elev = target.elev ? target.elev() : 0;
        const wx = target._x, wy = target._z - elev;
        return {
            x: canvas.width  / 2 - camera.x * camera.zoom + wx * camera.zoom,
            y: canvas.height / 2 - camera.y * camera.zoom + wy * camera.zoom - (target.promptLift || INTERACT_PROMPT.lift)
        };
    }
    // Desenhado em ESPAÇO DE TELA (depois do ctx.restore() da câmera), mas na
    // posição projetada do objeto — então acompanha o mundo conforme a câmera anda.
    function draw(g){
        rect = null;
        if(dialog.active || paused || screen !== 'game') return;
        if(alpha <= 0.02 || !target) return;
        const p = screenPos();
        if(!p) return;
        const label = currentLabel();
        const s = pulseScale();
        g.save();
        g.globalAlpha = Math.max(0, Math.min(1, alpha));
        const img = interactPromptImg.ready ? interactPromptImg.img : null;
        if(img){
            const ih0 = INTERACT_PROMPT.displayH;
            const iw0 = img.naturalWidth * (ih0 / img.naturalHeight);   // proporção original, sem deformar
            const ih = ih0 * s, iw = iw0 * s;                           // pulsada leve, a partir do centro
            const cx = p.x, cy = p.y - ih0 / 2;
            const ix = cx - iw / 2, iy = cy - ih / 2;
            g.drawImage(img, ix, iy, iw, ih);
            if(label){
                const L = INTERACT_PROMPT.label;
                g.font = L.font; g.textAlign = L.align || 'left'; g.textBaseline = 'middle';
                g.fillStyle = L.color;
                g.fillText(label, ix + iw * L.xFrac, iy + ih * L.yFrac);
                g.textAlign = 'left'; g.textBaseline = 'alphabetic';
            }
            rect = { x: ix, y: iy, w: iw, h: ih };
        } else {
            // Sem o PNG ainda: mostra só o texto da ação num selo mínimo (NÃO é
            // uma imagem provisória — é o rótulo que de qualquer forma existiria).
            g.font = INTERACT_PROMPT.label.font; g.textAlign = 'center'; g.textBaseline = 'middle';
            const w = g.measureText(label).width + 22, h = 22;
            const bx = p.x - w / 2, by = p.y - h;
            g.fillStyle = 'rgba(10,12,20,0.78)';
            roundRect(bx, by, w, h, 8); g.fill();
            g.fillStyle = '#eaf7ff';
            g.fillText(label, p.x, by + h / 2 + 1);
            g.textBaseline = 'alphabetic';
            rect = { x: bx, y: by, w: w, h: h };
        }
        g.restore();
    }
    function promptRect(){ return rect; }

    return { register, clearAll, reset, update, draw, hasTarget, currentLabel, confirm, promptRect,
             get alpha(){ return alpha; } };
})();

// ── Registro dos objetos interagíveis que já existem no jogo ──
// (as closures leem o estado ao vivo — zona, onPlateau, .open — então não é
//  preciso re-registrar em reset())
(function registerInteractables(){
    // NPCs — aproximar mostra [ ] FALAR; só conversa ao confirmar.
    npcs.forEach(n => InteractionManager.register({
        id: n.id, type: 'npc',
        interactionLabel: 'FALAR',
        interactionRange: 90,
        promptLift: 96,
        worldX: () => n.x, worldZ: () => n.z,
        elev: () => (n.zone === 'plateau' ? PLATEAU.elev : 0),
        available: () => {
            if(n.zone === 'cave'    && zone !== 'cave') return false;
            if(n.zone === 'plateau' && !(zone === 'overworld' && player.onPlateau)) return false;
            return !dialog.active;
        },
        onInteract: () => { if(!dialog.active) interactWith(n); }
    }));

    // Baú da espada (caverna) — não abre mais por proximidade.
    InteractionManager.register({
        id: 'chest_sword', type: 'chest',
        interactionLabel: 'ABRIR', interactionRange: 80, promptLift: 58,
        worldX: () => chest.x, worldZ: () => chest.z, elev: () => 0,
        available: () => zone === 'cave' && !chest.open,
        onInteract: () => {
            chest.open = true; player.hasSword = true;
            autoPlaceEquipment('sword'); renderSlotHud();
            showToast('Espada obtida! Entrou no slot ' + SLOT_LETTER[SLOT_NAMES.find(s => equipmentSlots[s] === 'sword') || 'right'] + '. Toque = golpe leve, segure = pesado.');
        }
    });

    // Baú do escudo (alto do relevo).
    InteractionManager.register({
        id: 'chest_shield', type: 'chest',
        interactionLabel: 'ABRIR', interactionRange: 80, promptLift: 60,
        worldX: () => chest2.x, worldZ: () => chest2.z, elev: () => PLATEAU.elev,
        available: () => zone === 'overworld' && player.onPlateau && !chest2.open,
        onInteract: () => {
            chest2.open = true; player.hasShield = true;
            autoPlaceEquipment('shield'); renderSlotHud();
            const sl = SLOT_LETTER[SLOT_NAMES.find(s => equipmentSlots[s] === 'shield') || 'bottom'];
            showToast('Escudo obtido! Entrou no slot ' + sl + '. Segure ' + sl + ' para bloquear — só protege na direção em que você olha.');
        }
    });

    // Baús de teste (poções / bumerangues).
    lootChests.forEach(c => InteractionManager.register({
        id: c.id, type: 'chest',
        interactionLabel: 'ABRIR', interactionRange: 74, promptLift: 56,
        worldX: () => c.x, worldZ: () => c.z, elev: () => PLATEAU.elev,
        available: () => zone === 'overworld' && player.onPlateau && !c.open,
        onInteract: () => { c.open = true; giveLoot(c.item); }
    }));

    // V34: levantar objeto (vaso) — uma só entrada resolve o mais próximo.
    InteractionManager.register({
        id: 'lift_object', type: 'lift',
        interactionLabel: 'LEVANTAR', interactionRange: CARRY_CFG.liftRange, promptLift: 46,
        worldX: () => { const o = nearestLiftable(); return o ? o.x : 1e9; },
        worldZ: () => { const o = nearestLiftable(); return o ? o.z : 1e9; },
        elev:   () => { const o = nearestLiftable(); return o ? o.elev : 0; },
        available: () => !!nearestLiftable(),
        onInteract: () => liftDestructible(nearestLiftable())
    });
    // V34: carregando → a única interação é arremessar (exclusive vence as outras).
    InteractionManager.register({
        id: 'throw_carried', type: 'throw', exclusive: true,
        interactionLabel: 'ARREMESSAR', interactionRange: 1e9, promptLift: 118,
        worldX: () => player.x, worldZ: () => player.z,
        elev: () => (zone === 'overworld' && player.onPlateau) ? PLATEAU.elev : 0,
        available: () => !!player.carrying,
        onInteract: () => throwCarried()
    });

    // V30: itens largados no chão — uma só entrada resolve o mais próximo.
    InteractionManager.register({
        id: 'dropped_item', type: 'pickup',
        interactionLabel: 'PEGAR', interactionRange: 54, promptLift: 40,
        worldX: () => { const d = nearestDroppedItem(); return d ? d.x : 1e9; },
        worldZ: () => { const d = nearestDroppedItem(); return d ? d.z : 1e9; },
        elev:   () => { const d = nearestDroppedItem(); return d ? d.elev : 0; },
        available: () => !!nearestDroppedItem(),
        onInteract: () => pickUpDroppedItem(nearestDroppedItem())
    });

    // V31: drops de moeda / coração / flechas — coletados por [B] PEGAR (nunca automático).
    InteractionManager.register({
        id: 'world_drop', type: 'pickup',
        interactionLabel: 'PEGAR', interactionRange: 52, promptLift: 38,
        worldX: () => { const d = nearestWorldDrop(); return d ? d.x : 1e9; },
        worldZ: () => { const d = nearestWorldDrop(); return d ? d.z : 1e9; },
        elev:   () => { const d = nearestWorldDrop(); return d ? d.elev : 0; },
        available: () => !!nearestWorldDrop(),
        onInteract: () => pickUpWorldDrop(nearestWorldDrop())
    });
})();

// ── START do controle = Pause (fixo). Poller próprio, roda mesmo pausado
//    (o gameLoop e o Gamepad.poll param quando paused). ──
let _padStartPrev = false;
(function gamepadSystemPoll(){
    if(navigator.getGamepads){
        const gp = Array.from(navigator.getGamepads()).find(p => p);
        const s = !!(gp && gp.buttons[GAMEPAD_START_BUTTON] && gp.buttons[GAMEPAD_START_BUTTON].pressed);
        if(s && !_padStartPrev && screen === 'game' && !gameOver){
            if(!paused) pauseGame();
            else if(typeof IAM !== 'undefined' && IAM.open) iamBack();
            else if(pauseView === 'inventory') showPauseView('pause');
            else resumeGame();
        }
        _padStartPrev = s;
    }
    requestAnimationFrame(gamepadSystemPoll);
})();
