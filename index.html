// ── OBJETOS DESTRUTÍVEIS: desenho (V34) ─────────────────────
// Sprite do ASSETS (obj_*) quando existir; senão, fallback em canvas.
// (x, y) = base do objeto na tela; `white` = piscada de impacto.
const DESTRUCTIBLE_PAINTERS = {
    grass(g, x, y, white){
        g.strokeStyle = white ? '#ffffff' : '#5fae45'; g.lineWidth = 2.2; g.lineCap = 'round';
        for(let i = -3; i <= 3; i++){
            g.beginPath(); g.moveTo(x + i*3.4, y);
            g.lineTo(x + i*5 + Math.sin(Date.now()/500 + i)*1.5, y - 14 - (3 - Math.abs(i))*2); g.stroke();
        }
    },
    bush(g, x, y, white){
        g.fillStyle = white ? '#ffffff' : '#2f6a2a';
        g.beginPath(); g.arc(x-9, y-11, 11, 0, Math.PI*2); g.arc(x+9, y-11, 11, 0, Math.PI*2); g.fill();
        g.fillStyle = white ? '#ffffff' : '#4f9a3c';
        g.beginPath(); g.arc(x, y-19, 13, 0, Math.PI*2); g.fill();
    },
    vase(g, x, y, white){
        g.fillStyle = white ? '#ffffff' : '#b8744a';
        g.beginPath(); g.ellipse(x, y-11, 11, 11, 0, 0, Math.PI*2); g.fill();
        g.fillRect(x-6, y-27, 12, 8);
        g.fillStyle = white ? '#ffffff' : '#8a5634';
        g.fillRect(x-8, y-29, 16, 4);
    },
    crate(g, x, y, white){
        g.fillStyle = white ? '#ffffff' : '#a87945';
        g.fillRect(x-16, y-30, 32, 30);
        g.strokeStyle = white ? '#dddddd' : '#6e4b26'; g.lineWidth = 2;
        g.strokeRect(x-16, y-30, 32, 30);
        g.beginPath(); g.moveTo(x-16, y-30); g.lineTo(x+16, y); g.moveTo(x+16, y-30); g.lineTo(x-16, y); g.stroke();
    },
    rock(g, x, y, white){
        g.fillStyle = white ? '#ffffff' : '#7d7d77';
        g.beginPath();
        g.moveTo(x-17, y); g.lineTo(x-14, y-16); g.lineTo(x-4, y-24); g.lineTo(x+10, y-21);
        g.lineTo(x+17, y-8); g.lineTo(x+15, y); g.closePath(); g.fill();
        g.fillStyle = 'rgba(255,255,255,0.12)';
        g.beginPath(); g.moveTo(x-10, y-15); g.lineTo(x-3, y-21); g.lineTo(x+6, y-18); g.lineTo(x-4, y-12); g.fill();
    }
};
function drawDestructible(o, x, y){
    const img = SpriteManager.get(o.cfg.asset);
    ctx.save();
    if(img){
        const s = o.cfg.drawH / img.naturalHeight, w = img.naturalWidth * s;
        if(o.flash > 0) ctx.globalAlpha = 0.55;
        ctx.drawImage(img, x - w/2, y - o.cfg.drawH, w, o.cfg.drawH);
    } else {
        const p = DESTRUCTIBLE_PAINTERS[o.type];
        if(p) p(ctx, x, y, o.flash > 0);
    }
    ctx.restore();
}

// ── RELEVO: parede com a entrada da caverna + escada ────────
function drawPlateau(){
    const P=PLATEAU, E=P.elev;
    const w=P.maxX-P.minX, h=P.maxZ-P.minZ;
    const wallTop=P.maxZ-E;

    // sombra projetada no chão, na base da parede
    ctx.fillStyle='rgba(0,0,0,0.4)';
    ctx.fillRect(P.minX-8, P.maxZ-2, w+16, 18);

    // parede frontal (sul)
    const g=ctx.createLinearGradient(0,wallTop,0,P.maxZ);
    g.addColorStop(0,'#414859'); g.addColorStop(1,'#1c212b');
    ctx.fillStyle=g;
    ctx.fillRect(P.minX,wallTop,w,E);
    ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.lineWidth=1;
    for(let i=0;i<14;i++){
        const rx=P.minX+((i*97+31)%w);
        ctx.beginPath(); ctx.moveTo(rx,wallTop+8); ctx.lineTo(rx+16,P.maxZ-6); ctx.stroke();
    }
    ctx.strokeStyle='rgba(0,0,0,0.45)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(P.minX,P.maxZ); ctx.lineTo(P.maxX,P.maxZ); ctx.stroke();

    // topo do relevo
    ctx.fillStyle='#2c3a33';
    ctx.fillRect(P.minX,P.minZ-E,w,h);
    ctx.fillStyle='rgba(255,255,255,0.035)';
    for(let i=0;i<70;i++){
        const px=P.minX+((i*173+61)%w), pz=(P.minZ-E)+((i*211+37)%h);
        ctx.fillRect(px,pz,3,2);
    }
    ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=1;
    for(let gx=P.minX; gx<=P.maxX; gx+=75){ ctx.beginPath(); ctx.moveTo(gx,P.minZ-E); ctx.lineTo(gx,P.maxZ-E); ctx.stroke(); }
    for(let gz=P.minZ-E; gz<=P.maxZ-E; gz+=75){ ctx.beginPath(); ctx.moveTo(P.minX,gz); ctx.lineTo(P.maxX,gz); ctx.stroke(); }
    ctx.strokeStyle='#5e7a68'; ctx.lineWidth=3;
    ctx.strokeRect(P.minX,P.minZ-E,w,h);

    // borda de grama pendurada na quina de cima da parede
    ctx.fillStyle='#3d5245';
    ctx.fillRect(P.minX,wallTop-4,w,9);

    // ── ESCADA (ponto de subida, longe da caverna) ──────────
    const s0=STAIR.x-STAIR.w/2, steps=7, totalH=E+20;
    ctx.fillStyle='rgba(0,0,0,0.35)';
    ctx.fillRect(s0-8, wallTop-2, STAIR.w+16, totalH+8);
    for(let i=0;i<steps;i++){
        const yy=wallTop+totalH*(i/steps);
        const gr=i*1.6;
        ctx.fillStyle = (i%2===0) ? '#6a7183' : '#575d6d';
        ctx.fillRect(s0-gr, yy, STAIR.w+gr*2, totalH/steps+1.5);
        ctx.strokeStyle='rgba(0,0,0,0.4)'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(s0-gr,yy); ctx.lineTo(s0+STAIR.w+gr,yy); ctx.stroke();
    }
    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.font='11px Segoe UI'; ctx.textAlign='center';
    ctx.fillText('ESCADA', STAIR.x, P.maxZ+42);

    // ── ENTRADA DA CAVERNA, aberta na parede do relevo ──────
    const dxp=CAVE_DOOR.x, hw=26;
    ctx.fillStyle='#050506';
    ctx.beginPath();
    ctx.moveTo(dxp-hw, P.maxZ);
    ctx.lineTo(dxp-hw, wallTop+30);
    ctx.arc(dxp, wallTop+30, hw, Math.PI, 0);
    ctx.lineTo(dxp+hw, P.maxZ);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle='rgba(150,140,175,0.55)'; ctx.lineWidth=3; ctx.stroke();
    const fl=Math.sin(Date.now()/300)*3;
    ctx.fillStyle='rgba(255,160,60,0.10)';
    ctx.beginPath(); ctx.ellipse(dxp, P.maxZ+6, 46+fl, 22, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.6)';
    ctx.font='12px Segoe UI'; ctx.textAlign='center';
    ctx.fillText('CAVERNA', dxp, P.maxZ+30);
}
function drawCaveRoom(){
    const R=CAVE_ROOM, w=R.maxX-R.minX, h=R.maxZ-R.minZ;
    ctx.fillStyle='#0c0b0f';
    ctx.fillRect(R.minX-160, R.minZ-160, w+320, h+320);
    ctx.fillStyle='#1b1720';
    ctx.fillRect(R.minX, R.minZ, w, h);
    ctx.strokeStyle='rgba(255,255,255,0.035)'; ctx.lineWidth=1;
    for(let gx=R.minX; gx<=R.maxX; gx+=56){ ctx.beginPath(); ctx.moveTo(gx,R.minZ); ctx.lineTo(gx,R.maxZ); ctx.stroke(); }
    for(let gz=R.minZ; gz<=R.maxZ; gz+=56){ ctx.beginPath(); ctx.moveTo(R.minX,gz); ctx.lineTo(R.maxX,gz); ctx.stroke(); }
    ctx.strokeStyle='#463a52'; ctx.lineWidth=26; ctx.strokeRect(R.minX, R.minZ, w, h);
    ctx.strokeStyle='#5a4c68'; ctx.lineWidth=4;  ctx.strokeRect(R.minX, R.minZ, w, h);
    ctx.fillStyle='#050506';
    ctx.fillRect(2000-34, R.maxZ-14, 68, 42);
    const torches=[[R.minX+34,R.minZ+34],[R.maxX-34,R.minZ+34],[R.minX+34,R.maxZ-34],[R.maxX-34,R.maxZ-34]];
    torches.forEach((p,i)=>{
        const fl=6+Math.sin(Date.now()/120+i)*2;
        ctx.fillStyle='rgba(255,150,50,0.16)';
        ctx.beginPath(); ctx.arc(p[0],p[1],44+fl,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#ffb347';
        ctx.beginPath(); ctx.arc(p[0],p[1],4+fl*0.3,0,Math.PI*2); ctx.fill();
    });
}

function draw() {
    ctx.fillStyle='#0a0a0c';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.save();
    ctx.translate(canvas.width/2-camera.x*camera.zoom,canvas.height/2-camera.y*camera.zoom);
    ctx.scale(camera.zoom,camera.zoom);

    if(zone==='cave'){
        drawCaveRoom();
    }else{
        ctx.strokeStyle='#1a1a20';ctx.lineWidth=2;
        for(let i=-16;i<=16;i++){
            let a=i*150;
            ctx.beginPath();ctx.moveTo(a,-2400);ctx.lineTo(a,2400);ctx.stroke();
            ctx.beginPath();ctx.moveTo(-2400,a);ctx.lineTo(2400,a);ctx.stroke();
        }
        drawPlateau();
    }

    const pElev=(zone==='overworld'&&player.onPlateau)?PLATEAU.elev:0;
    const ents=[{x:player.x,z:player.z,t:'p',f:player.flash,elev:pElev}];
    if(zone==='overworld'){
        if(enemyStillShown(enemy)) ents.push({x:enemy.x,z:enemy.z,t:'e',f:enemy.flash,attacking:enemy.attacking,elev:0});
        ents.push({x:TREE.x,z:TREE.z,t:'tree',f:0,elev:PLATEAU.elev});
        if(!chest2.open) ents.push({x:chest2.x,z:chest2.z,t:'c2',f:0,elev:PLATEAU.elev});
        lootChests.forEach(c=>{ if(!c.open) ents.push({x:c.x,z:c.z,t:'loot',f:0,elev:PLATEAU.elev}); });
        if(enemyStillShown(bird)) ents.push({x:bird.x,z:bird.z,t:'bird',f:bird.flash,elev:PLATEAU.elev+bird.alt,s:bird.z-PLATEAU.elev});
        if(enemyStillShown(seedShooter)) ents.push({x:seedShooter.x,z:seedShooter.z,t:'seedshooter',f:seedShooter.flash,elev:0});
        [octorokRed,octorokBlue].forEach(o=>{ if(enemyStillShown(o)) ents.push({x:o.x,z:o.z,t:'octorok',f:o.flash,elev:0,oct:o}); });
        [moblinRed,moblinBlue].forEach(m=>{ if(enemyStillShown(m)) ents.push({x:m.x,z:m.z,t:'moblin',f:m.flash,elev:0,mob:m}); });
        npcs.forEach(n=>{ if(n.zone==='plateau') ents.push({x:n.x,z:n.z,t:'n',f:0,npc:n,elev:PLATEAU.elev}); });
    }else{
        if(!chest.open) ents.push({x:chest.x,z:chest.z,t:'c',f:0,elev:0});
        npcs.forEach(n=>{ if(n.zone==='cave') ents.push({x:n.x,z:n.z,t:'n',f:0,npc:n,elev:0}); });
    }
    // V30: itens largados no chão (na zona atual)
    droppedItems.forEach(d=>{ if(d.zone===zone) ents.push({x:d.x,z:d.z,t:'drop',f:0,elev:d.elev||0,drop:d}); });
    // V31: bombas com pavio + drops de moeda/coração/flechas no mundo
    bombs.forEach(b=>{ if(b.zone===zone) ents.push({x:b.x,z:b.z,t:'bomb',f:0,elev:b.elev||0,bomb:b}); });
    worldDrops.forEach(d=>{ if(d.zone===zone) ents.push({x:d.x,z:d.z,t:'wdrop',f:0,elev:d.elev||0,wd:d}); });
    // V34: objetos destrutíveis ainda inteiros (na zona atual)
    destructibles.forEach(o=>{ if(!o.dead && o.zone===zone) ents.push({x:o.x,z:o.z,t:'destr',f:o.flash,elev:o.elev,obj:o}); });
    thrownObjects.forEach(p=>{ if(!p.done && p.zone===zone) ents.push({x:p.x,z:p.z,t:'thrown',f:0,elev:p.elev,th:p}); });

    const sortVal=e=>(e.s!==undefined?e.s:e.z-(e.elev||0));
    ents.sort((a,b)=>sortVal(a)-sortVal(b)).forEach(e=>{
        const iso={x:e.x,y:e.z-(e.elev||0)};   // câmera top-down: mundo (x,z) → tela (x,y)
        if(e.t==='bird'){
            const gy=e.z-PLATEAU.elev;
            ctx.fillStyle='rgba(0,0,0,0.28)';
            ctx.beginPath();ctx.ellipse(e.x,gy,16,7,0,0,Math.PI*2);ctx.fill();
        }else if(e.t==='tree'){
            ctx.fillStyle='rgba(0,0,0,0.35)';
            ctx.beginPath();ctx.ellipse(iso.x,iso.y,40,16,0,0,Math.PI*2);ctx.fill();
        }else if(e.t==='thrown'){
            const k=Math.max(0.4, 1-e.th.h/90);   // sombra cresce conforme o vaso desce
            ctx.fillStyle='rgba(0,0,0,0.25)';
            ctx.beginPath();ctx.ellipse(iso.x,iso.y,13*k,5*k,0,0,Math.PI*2);ctx.fill();
        }else if(e.t==='destr'){
            const sw=e.obj.cfg.w;
            ctx.fillStyle = e.obj.type==='grass' ? 'rgba(0,0,0,0.14)' : 'rgba(0,0,0,0.28)';
            ctx.beginPath();ctx.ellipse(iso.x,iso.y,sw*0.6,sw*0.24,0,0,Math.PI*2);ctx.fill();
        }else{
            ctx.fillStyle='rgba(0,0,0,0.3)';
            ctx.beginPath();ctx.ellipse(iso.x,iso.y,28,13,0,0,Math.PI*2);ctx.fill();
        }
        if(e.t==='p'){
            const bodyY = iso.y-52-player.y;
            const dirIndex = Math.max(0, DIR_ORDER.indexOf(getScreenDirection(player.angle)));
            const SPRITE_H = 68;
            // A mecânica só escreveu player.state. O AnimationManager escolhe a
            // folha, avança os frames e resolve o fallback (walk→idle, roll→idle...).
            // Se ainda não há nenhuma folha aplicável, cai no ÚNICO fallback bruto.
            const spriteDrawn = AnimationManager.draw(
                ctx, player, 'player', player.state, dirIndex, iso.x, iso.y - player.y, SPRITE_H
            );
            if (!spriteDrawn) drawPlayerFallback(iso.x, bodyY, e.f);
            if(player.flash>0)player.flash--;

            // V34: objeto nas mãos — sobe do chão à frente até acima da cabeça
            if(player.carrying){
                const lk = player.liftT>0 ? 1 - player.liftT/CARRY_CFG.liftTime : 1;
                drawDestructible(player.carrying,
                    iso.x + (1-lk)*Math.cos(player.angle)*22,
                    iso.y - player.y - CARRY_CFG.headH*lk);
            }

            if(staminaUIAlpha>0.01){
                const scx = iso.x + 26, scy = bodyY - 6, sr = 11;
                const pct = Math.max(0, Math.min(1, stamina/100));
                ctx.save();
                ctx.globalAlpha = staminaUIAlpha;
                ctx.fillStyle = 'rgba(0,0,0,0.55)';
                ctx.beginPath(); ctx.arc(scx, scy, sr+2.5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath();
                ctx.moveTo(scx, scy);
                ctx.arc(scx, scy, sr, -Math.PI/2, -Math.PI/2 + Math.PI*2*pct);
                ctx.closePath();
                ctx.fillStyle = pct>0.3 ? '#00ffcc' : '#ff5555';
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.6)';
                ctx.lineWidth = 1.4;
                ctx.beginPath(); ctx.arc(scx, scy, sr+2.5, 0, Math.PI*2); ctx.stroke();
                ctx.restore();
            }

            if(heavyCharge.active){
                const cp=Math.min(1,heavyCharge.t/0.35);
                ctx.save();
                ctx.strokeStyle = cp>=1 ? '#ff5522' : 'rgba(255,160,90,0.75)';
                ctx.lineWidth = 4;
                if(cp>=1){ ctx.shadowColor='#ff4400'; ctx.shadowBlur=16; }
                ctx.beginPath();
                ctx.arc(iso.x, iso.y-26-player.y, 40, -Math.PI/2, -Math.PI/2+Math.PI*2*cp);
                ctx.stroke();
                ctx.restore();
            }
            if(player.hasShield && player.blocking){
                // V33: o escudo aparece na MESMA direção (8) que o bloqueio usa
                const shAng = dir8Angle(player.angle);
                const sxp = iso.x + Math.cos(shAng)*24;
                const syp = (iso.y-30-player.y) + Math.sin(shAng)*24;
                ctx.save();
                ctx.translate(sxp, syp);
                ctx.rotate(shAng);
                ctx.fillStyle   = blockFx>0 ? 'rgba(190,242,255,0.95)' : 'rgba(120,168,198,0.88)';
                ctx.strokeStyle = blockFx>0 ? '#ffffff' : '#8fb6cc';
                if(blockFx>0){ ctx.shadowColor='#7fe3ff'; ctx.shadowBlur=18; }
                ctx.beginPath();
                ctx.moveTo(0,-19); ctx.lineTo(10,-11); ctx.lineTo(10,12);
                ctx.lineTo(0,21);  ctx.lineTo(-10,12); ctx.lineTo(-10,-11);
                ctx.closePath();
                ctx.fill(); ctx.lineWidth=2; ctx.stroke();
                ctx.shadowBlur=0;
                ctx.restore();
            }

            if(player.hasSword && (equippedWeapon==='sword' || SLOT_NAMES.some(s=>equipmentSlots[s]==='sword'))){
                const swinging = player.isAttacking;
                const heavy    = player.atkType==='heavy';
                const baseAng  = player.angle;
                const swingOff = swinging ? (heavy ? 2.0 : 1.4) : 0.4;
                const swordAng = baseAng - swingOff;
                const hx = iso.x + Math.cos(swordAng) * 18;
                const hy = (iso.y - 30 - player.y) + Math.sin(swordAng) * 18;

                ctx.save();
                ctx.translate(hx, hy);
                ctx.rotate(swordAng + Math.PI/4);
                const bladeColor = swinging ? (heavy ? '#ff6633' : '#00eeff') : '#c8d8e8';
                ctx.strokeStyle = bladeColor;
                ctx.lineWidth   = swinging ? 5 : 3;
                ctx.lineCap     = 'round';
                if(swinging){ ctx.shadowColor = bladeColor; ctx.shadowBlur = 14; }
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -36); ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#888'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(8, 0); ctx.stroke();
                ctx.restore();

                if(swinging){
                    ctx.strokeStyle = heavy ? 'rgba(255,80,0,0.55)' : 'rgba(0,220,255,0.55)';
                    ctx.lineWidth   = heavy ? 10 : 7;
                    ctx.shadowColor = heavy ? '#ff4400' : '#00d4ff';
                    ctx.shadowBlur  = 20;
                    ctx.beginPath();
                    ctx.arc(iso.x, iso.y-26-player.y, 62, player.angle-1.3, player.angle+1.3);
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }
            }

        }else if(e.t==='e'){
            const atk=e.attacking>0;
            // corpo: sprite pelo AnimationManager; sem folha ainda → primitiva
            if(!AnimationManager.draw(ctx, enemy, 'goblin', goblinAnimState(), 0, iso.x, iso.y, HITBOXES.goblin.h)){
                ctx.fillStyle=(e.f>0)?'#ffffff':(atk?'#ff2222':'#e74c3c');
                const sb=atk?6:0;
                ctx.fillRect(iso.x-20-sb/2,iso.y-62-sb/2,40+sb,62+sb);
            }
            if(enemy.flash>0)enemy.flash--;

            if(enemy.barAlpha>0){
                const bw=56, bh=8, bx=iso.x-bw/2, by=iso.y-90;
                ctx.save();
                ctx.globalAlpha=enemy.barAlpha;
                ctx.fillStyle='rgba(0,0,0,0.6)';
                roundRect(bx-2,by-2,bw+4,bh+4,3); ctx.fill();
                ctx.fillStyle='#3a0a0a';
                ctx.fillRect(bx,by,bw,bh);
                const pct=Math.max(0,enemy.hp)/enemy.maxHp;
                ctx.fillStyle= pct<=0.3 ? '#ff6a3d' : '#ff3b3b';
                ctx.fillRect(bx,by,bw*pct,bh);
                ctx.strokeStyle='rgba(255,255,255,0.55)';
                ctx.lineWidth=1;
                ctx.strokeRect(bx,by,bw,bh);
                ctx.restore();
            }

            if(atk){
                const prog = 1 - (e.attacking / 18);
                const radius = 45 + prog * 25;
                const alpha  = 1 - prog * 0.5;
                ctx.strokeStyle = `rgba(255,120,0,${alpha})`;
                ctx.lineWidth   = 12 - prog*6;
                ctx.shadowColor = '#ff6600';
                ctx.shadowBlur  = 18;
                ctx.beginPath();
                ctx.arc(iso.x, iso.y-31, radius, enemy.atkAngle-1.1, enemy.atkAngle+1.1);
                ctx.stroke();
                ctx.shadowBlur = 0;

                ctx.save();
                const sx = iso.x + Math.cos(enemy.atkAngle)*22;
                const sy = (iso.y-31) + Math.sin(enemy.atkAngle)*22;
                ctx.translate(sx, sy);
                ctx.rotate(enemy.atkAngle + Math.PI/4);
                ctx.strokeStyle = `rgba(255,200,80,${alpha})`;
                ctx.lineWidth   = 4;
                ctx.shadowColor = '#ffaa00';
                ctx.shadowBlur  = 10;
                ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-30); ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.restore();
            }

        }else if(e.t==='tree'){
            // tronco
            ctx.fillStyle='#4a3524';
            ctx.fillRect(iso.x-9, iso.y-64, 18, 64);
            ctx.fillStyle='#3a2a1c';
            ctx.fillRect(iso.x-9, iso.y-64, 6, 64);
            // galho onde a ave pousa
            ctx.strokeStyle='#4a3524'; ctx.lineWidth=6; ctx.lineCap='round';
            ctx.beginPath(); ctx.moveTo(iso.x+4,iso.y-52); ctx.lineTo(iso.x+30,iso.y-62); ctx.stroke();
            // copa
            const cyt=iso.y-96;
            ctx.fillStyle='#254b31';
            ctx.beginPath(); ctx.arc(iso.x-22,cyt+14,30,0,Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(iso.x+24,cyt+10,28,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#2f6440';
            ctx.beginPath(); ctx.arc(iso.x,cyt-6,38,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='rgba(255,255,255,0.07)';
            ctx.beginPath(); ctx.arc(iso.x-12,cyt-16,18,0,Math.PI*2); ctx.fill();

        }else if(e.t==='c' || e.t==='c2' || e.t==='loot'){
            // V34: baú da espada / do escudo / de itens — fechado e sem pista do conteúdo
            drawClosedChest(iso.x, iso.y);

        }else if(e.t==='destr'){
            drawDestructible(e.obj, iso.x, iso.y);

        }else if(e.t==='thrown'){
            drawDestructible(e.th.obj, iso.x, iso.y - e.th.h);   // V34: vaso em voo (mesmo desenho do objeto)

        }else if(e.t==='drop'){
            // V30: item largado no chão — sombra + ícone flutuando + xN
            const eq = EQUIPMENT[e.drop.id];
            const bb = Math.sin(Date.now()/220 + iso.x*0.05)*3;
            ctx.save();
            ctx.fillStyle='rgba(0,0,0,0.32)';
            ctx.beginPath(); ctx.ellipse(iso.x, iso.y+2, 13, 5, 0, 0, Math.PI*2); ctx.fill();
            ctx.font='20px Segoe UI'; ctx.textAlign='center'; ctx.textBaseline='middle';
            ctx.fillText(eq ? eq.icon : '❔', iso.x, iso.y-13+bb);
            if((e.drop.qty||1) > 1){
                ctx.font='bold 9px Segoe UI'; ctx.fillStyle='#f0c674'; ctx.textBaseline='alphabetic';
                ctx.fillText('x'+e.drop.qty, iso.x+13, iso.y-3+bb);
            }
            ctx.textBaseline='alphabetic';
            ctx.restore();

        }else if(e.t==='octorok'){
            const o=e.oct, c=OCTOROK_CFG[o.variant];
            if(!AnimationManager.draw(ctx, o, 'octorok', octorokAnimState(o), 0, iso.x, iso.y, 30)){
                ctx.save();
                ctx.fillStyle = e.f>0 ? '#ffffff' : c.tint;
                ctx.beginPath(); ctx.ellipse(iso.x, iso.y-13, 15, 13, 0, 0, Math.PI*2); ctx.fill();
                // "bico"/tubo na direção atual
                const v=DIR4_VEC[o.dir];
                ctx.fillStyle = e.f>0 ? '#ffffff' : '#caa15a';
                ctx.fillRect(iso.x+v[0]*10-3, iso.y-16+v[1]*10-3, 6, 6);
                // olhos
                ctx.fillStyle='#0b0b0d';
                ctx.beginPath(); ctx.arc(iso.x-5, iso.y-16, 2, 0, Math.PI*2); ctx.arc(iso.x+5, iso.y-16, 2, 0, Math.PI*2); ctx.fill();
                // 4 patinhas
                ctx.strokeStyle=c.tint; ctx.lineWidth=3;
                for(let i=0;i<4;i++){ const a=Math.PI/4+i*Math.PI/2; ctx.beginPath(); ctx.moveTo(iso.x+Math.cos(a)*11, iso.y-6+Math.sin(a)*7); ctx.lineTo(iso.x+Math.cos(a)*17, iso.y-2+Math.sin(a)*10); ctx.stroke(); }
                ctx.restore();
            }
            if(o.hasBeenHit && !o.dead){
                const bw=40,bh=6,bxx=iso.x-bw/2,byy=iso.y-40;
                ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(bxx-2,byy-2,bw+4,bh+4);
                ctx.fillStyle='#301'; ctx.fillRect(bxx,byy,bw,bh);
                ctx.fillStyle=c.tint; ctx.fillRect(bxx,byy,bw*Math.max(0,o.hp)/o.maxHp,bh);
            }

        }else if(e.t==='moblin'){
            const m=e.mob, c=MOBLIN_CFG[m.variant];
            const tint = m.variant==='blue' ? '#3f6bd0' : '#c24a33';
            if(!AnimationManager.draw(ctx, m, 'spear_moblin', moblinAnimState(m), 0, iso.x, iso.y, 44)){
                ctx.save();
                // corpo
                ctx.fillStyle = e.f>0 ? '#ffffff' : (m.state==='stunned' ? '#8a8a8a' : tint);
                ctx.fillRect(iso.x-11, iso.y-34, 22, 34);
                ctx.beginPath(); ctx.arc(iso.x, iso.y-40, 8, 0, Math.PI*2); ctx.fill();
                // lança à frente
                const dxL = Math.cos(m.face), dzL = Math.sin(m.face);
                ctx.strokeStyle = m.state==='stunned' ? '#9a7b3a' : '#c9a24b';
                ctx.lineWidth = m.state==='charge' ? 5 : 3;
                ctx.beginPath();
                ctx.moveTo(iso.x+dxL*6, iso.y-22+dzL*4);
                ctx.lineTo(iso.x+dxL*HITBOXES.spear_moblin.spearLen, iso.y-22+dzL*HITBOXES.spear_moblin.spearLen*0.6);
                ctx.stroke();
                if(m.state==='stunned'){
                    ctx.fillStyle='#ffd23f'; ctx.font='bold 12px Segoe UI'; ctx.textAlign='center';
                    ctx.fillText('atordoado', iso.x, iso.y-52 + Math.sin(Date.now()/120)*2);
                } else if(m.state==='alert'){
                    ctx.fillStyle='#ff5a5a'; ctx.font='bold 14px Segoe UI'; ctx.textAlign='center';
                    ctx.fillText('!', iso.x, iso.y-52);
                }
                ctx.restore();
            }
            if(m.hasBeenHit && !m.dead){
                const bw=46,bh=6,bxx=iso.x-bw/2,byy=iso.y-46;
                ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(bxx-2,byy-2,bw+4,bh+4);
                ctx.fillStyle='#201'; ctx.fillRect(bxx,byy,bw,bh);
                ctx.fillStyle=tint; ctx.fillRect(bxx,byy,bw*Math.max(0,m.hp)/m.maxHp,bh);
            }

        }else if(e.t==='bomb'){
            const b=e.bomb, k=b.t/BOMB_CFG.fuse;
            const blink = (Math.sin(b.t * (6 + k*40)) > 0);
            ctx.save();
            ctx.fillStyle='#20242c';
            ctx.beginPath(); ctx.arc(iso.x, iso.y-9, 9, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = blink ? '#ff5522' : '#7a3'; ctx.lineWidth=2;
            ctx.beginPath(); ctx.moveTo(iso.x+4, iso.y-16); ctx.quadraticCurveTo(iso.x+12, iso.y-24, iso.x+9, iso.y-30); ctx.stroke();
            if(blink){ ctx.fillStyle='#ffcf6b'; ctx.beginPath(); ctx.arc(iso.x+9, iso.y-31, 2.5, 0, Math.PI*2); ctx.fill(); }
            ctx.restore();

        }else if(e.t==='wdrop'){
            const d=e.wd, bb=Math.sin(Date.now()/200 + iso.x*0.06)*3;
            ctx.save();
            ctx.fillStyle='rgba(0,0,0,0.3)';
            ctx.beginPath(); ctx.ellipse(iso.x, iso.y, 11, 4, 0, 0, Math.PI*2); ctx.fill();
            if(d.kind==='currency'){
                const rt = RUPEE_TYPES[d.id] || RUPEE_TYPES.green_rupee;
                ctx.translate(iso.x, iso.y-12+bb);
                ctx.fillStyle=rt.tint; ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=1.5;
                ctx.beginPath();
                ctx.moveTo(0,-9); ctx.lineTo(6,-3); ctx.lineTo(6,3); ctx.lineTo(0,9); ctx.lineTo(-6,3); ctx.lineTo(-6,-3);
                ctx.closePath(); ctx.fill(); ctx.stroke();
            } else if(d.kind==='heart'){
                ctx.translate(iso.x-7, iso.y-19+bb);
                heartPath(0,0,14);
                ctx.fillStyle='#ff5a76'; ctx.fill();
                ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=1.5; ctx.stroke();
            } else {
                ctx.translate(iso.x, iso.y-12+bb);
                ctx.fillStyle='#d8c69a';
                ctx.beginPath(); ctx.moveTo(-8,4); ctx.lineTo(8,-4); ctx.lineTo(6,-1); ctx.lineTo(9,-5); ctx.lineTo(4,-5); ctx.lineTo(8,-4); ctx.closePath(); ctx.fill();
                ctx.fillStyle='#f0c674'; ctx.font='bold 9px Segoe UI'; ctx.textAlign='center';
                ctx.fillText('x'+(d.qty||1), 0, 16);
            }
            ctx.restore();

        }else if(e.t==='bird'){
            const bx=iso.x, by=iso.y;
            const fc = bird.face;
            // corpo: sprite pelo AnimationManager; sem folha ainda → primitiva
            if(!AnimationManager.draw(ctx, bird, 'bird', birdAnimState(), 0, bx, by, 30)){
                ctx.fillStyle = e.f>0 ? '#ffffff' : '#6d4d92';
                ctx.beginPath(); ctx.ellipse(bx,by,15,11,0,0,Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(bx+fc*11,by-8,8,0,Math.PI*2); ctx.fill();
                ctx.fillStyle='#ffc247';
                ctx.beginPath();
                ctx.moveTo(bx+fc*16,by-10); ctx.lineTo(bx+fc*28,by-7); ctx.lineTo(bx+fc*16,by-4);
                ctx.closePath(); ctx.fill();
                ctx.fillStyle='#ffffff';
                ctx.beginPath(); ctx.arc(bx+fc*12,by-10,2.4,0,Math.PI*2); ctx.fill();
            }

            if(bird.chipFx>0){
                ctx.save();
                ctx.globalAlpha=Math.min(1,bird.chipFx/22);
                ctx.fillStyle='#ffd23f';
                ctx.font='bold 12px Segoe UI'; ctx.textAlign='center';
                ctx.fillText('resistiu!', bx, by-46-(42-bird.chipFx)*0.4);
                ctx.restore();
            }

            // barra de vida da ave, só aparece depois do primeiro golpe
            if(bird.hasBeenHit){
                const bw=48, bh=7, bxx=bx-bw/2, byy=by-34;
                ctx.save();
                ctx.fillStyle='rgba(0,0,0,0.6)';
                roundRect(bxx-2,byy-2,bw+4,bh+4,3); ctx.fill();
                ctx.fillStyle='#2a0a2a';
                ctx.fillRect(bxx,byy,bw,bh);
                const pct=Math.max(0,bird.hp)/bird.maxHp;
                ctx.fillStyle= pct<=0.34 ? '#ff6a3d' : '#c86bff';
                ctx.fillRect(bxx,byy,bw*pct,bh);
                ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=1;
                ctx.strokeRect(bxx,byy,bw,bh);
                ctx.restore();
            }

        }else if(e.t==='seedshooter'){
            const s=seedShooter;
            // corpo: sprite pelo AnimationManager (estados hidden/emerge/alert/shoot/hurt);
            // sem folha ainda → primitivas (arbusto / figura em pé)
            const ssDrawn = AnimationManager.draw(ctx, s, 'seed_shooter', seedShooterAnimState(), 0, iso.x, iso.y, HITBOXES.seed_shooter.h);
            if(s.state==='hidden'){
                if(!ssDrawn){
                // aparência de arbusto (escondido = imune à espada)
                ctx.fillStyle = s.flash>0 ? '#ffffff' : '#2f6440';
                ctx.beginPath();
                ctx.arc(iso.x-9, iso.y-9, 12, 0, Math.PI*2);
                ctx.arc(iso.x+9, iso.y-9, 12, 0, Math.PI*2);
                ctx.arc(iso.x,   iso.y-17, 14, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle='rgba(255,255,255,0.07)';
                ctx.beginPath(); ctx.arc(iso.x-6, iso.y-19, 5, 0, Math.PI*2); ctx.fill();
                }
            }else{
                if(!ssDrawn){
                // em pé, vulnerável, olhando o jogador (4 direções)
                ctx.fillStyle = s.flash>0 ? '#ffffff' : (s.stunT>0 ? '#c8a24a' : '#5b8f3a');
                ctx.fillRect(iso.x-12, iso.y-40, 24, 40);
                ctx.fillStyle = '#d8b271';
                ctx.beginPath(); ctx.arc(iso.x, iso.y-46, 8, 0, Math.PI*2); ctx.fill();
                const v = DIR4_VEC[s.dir] || [0,1];
                ctx.strokeStyle='#3a2a1c'; ctx.lineWidth=5; ctx.lineCap='round';
                ctx.beginPath();
                ctx.moveTo(iso.x, iso.y-24);
                ctx.lineTo(iso.x + v[0]*15, iso.y-24 + v[1]*15);
                ctx.stroke();
                }
                if(s.stunT>0){
                    ctx.fillStyle='#ffd23f'; ctx.font='12px Segoe UI'; ctx.textAlign='center';
                    ctx.fillText('★', iso.x-6+Math.sin(Date.now()/90)*4, iso.y-52);
                    ctx.fillText('★', iso.x+7+Math.cos(Date.now()/90)*4, iso.y-47);
                }
                if(s.hasBeenHit && s.hp>0){
                    const bw=44,bh=6,bxx=iso.x-bw/2,byy=iso.y-56;
                    ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(bxx-2,byy-2,bw+4,bh+4);
                    ctx.fillStyle='#1e3a12'; ctx.fillRect(bxx,byy,bw,bh);
                    const pct=Math.max(0,s.hp)/s.maxHp;
                    ctx.fillStyle= pct<=0.34 ? '#ff6a3d' : '#8ee06a';
                    ctx.fillRect(bxx,byy,bw*pct,bh);
                    ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=1; ctx.strokeRect(bxx,byy,bw,bh);
                }
            }
            ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.font='9px Segoe UI'; ctx.textAlign='center';
            ctx.fillText('Atirador de Sementes', iso.x, iso.y+15);

        }else if(e.t==='n'){
            const n=e.npc;
            ctx.fillStyle='#8d6e4f';
            ctx.fillRect(iso.x-13, iso.y-46, 26, 46);
            ctx.fillStyle='#6f553c';
            ctx.fillRect(iso.x-13, iso.y-20, 26, 20);
            ctx.fillStyle='#e8c9a4';
            ctx.beginPath(); ctx.arc(iso.x, iso.y-52, 8, 0, Math.PI*2); ctx.fill();
            // (o indicador de "falar" agora é o InteractionManager, desenhado
            //  depois da câmera para acompanhar o NPC na tela)

        }else{
            ctx.fillStyle='#f1c40f';
            ctx.fillRect(iso.x-20,iso.y-25,40,30);
        }
    });

    // ── Sementes (projéteis) ─────────────────────────────────
    for(const p of seeds){
        ctx.save();
        ctx.translate(p.x, p.z);
        ctx.rotate(p.spin);
        ctx.fillStyle = '#cdb26a';
        ctx.strokeStyle = '#7a642f';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.ellipse(0, 0, 6, 4.2, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.restore();
    }

    // ── V31: Pedras do Octorok ───────────────────────────────
    for(const p of rocks){
        ctx.save();
        ctx.translate(p.x, p.z - 4);
        ctx.rotate(p.spin);
        ctx.fillStyle = '#8f8a80';
        ctx.strokeStyle = '#59544c';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-6,-2); ctx.lineTo(-1,-6); ctx.lineTo(5,-4); ctx.lineTo(6,2); ctx.lineTo(1,6); ctx.lineTo(-5,4);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.restore();
    }
    // ── V31: Flechas ─────────────────────────────────────────
    for(const p of arrows){
        ctx.save();
        ctx.translate(p.x, p.z - 4);
        ctx.rotate(Math.atan2(p.dirZ, p.dirX));
        ctx.strokeStyle = '#e9dcc0'; ctx.fillStyle = '#e9dcc0'; ctx.lineWidth = 2; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(-11, 0); ctx.lineTo(7, 0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(13, 0); ctx.lineTo(5, -4); ctx.lineTo(5, 4); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#b9a97f';
        ctx.beginPath(); ctx.moveTo(-11, 0); ctx.lineTo(-14, -3); ctx.moveTo(-11, 0); ctx.lineTo(-14, 3); ctx.stroke();
        ctx.restore();
    }
    // ── V31: Bombas com pavio (desenhadas junto às entidades acima; aqui só
    //    reforça a leve luz do pavio piscando) — nada extra necessário. ──

    // ── Bumerangue em voo ────────────────────────────────────
    if(boomerang.active){
        ctx.save();
        ctx.translate(boomerang.x, boomerang.z);
        ctx.rotate(boomerang.spin);
        const magic = boomerang.cfg && boomerang.cfg.control;
        ctx.strokeStyle = magic ? '#7fd7ff' : '#d8b26a';
        ctx.lineWidth = 5; ctx.lineCap = 'round';
        if(magic){ ctx.shadowColor = '#7fd7ff'; ctx.shadowBlur = 12; }
        ctx.beginPath();
        ctx.moveTo(-10, -3); ctx.lineTo(0, -10); ctx.lineTo(10, -3);
        ctx.moveTo(0, -10);  ctx.lineTo(0, 10);
        ctx.stroke();
        ctx.restore();
    }

    // ── EFEITOS VISUAIS (poeira, impacto, cura...) ─────
    // Sistema independente das animações das personagens. Desenha no espaço
    // do mundo (ainda dentro do translate/scale da câmera).
    Effects.draw(ctx);

    ctx.restore();

    // ── Indicador de interação contextual ────────────────────
    // Espaço de tela, mas na posição projetada do objeto → acompanha o mundo.
    InteractionManager.draw(ctx);

    // ── Aviso na tela (fora da câmera) ───────────────────────
    if(toast.t>0){
        ctx.save();
        ctx.globalAlpha=Math.min(1,toast.t/0.6);
        ctx.font='14px Segoe UI'; ctx.textAlign='center';
        const maxW=Math.min(560,canvas.width-60);
        const lines=wrapText(toast.text,maxW-28);
        const bh=lines.length*20+20, bw=maxW, bx=canvas.width/2-bw/2, by=76;
        ctx.fillStyle='rgba(8,10,20,0.9)';
        ctx.strokeStyle='#7ad7ff'; ctx.lineWidth=2;
        roundRect(bx,by,bw,bh,10); ctx.fill(); ctx.stroke();
        ctx.fillStyle='#eaf7ff';
        lines.forEach((ln,i)=>ctx.fillText(ln, canvas.width/2, by+26+i*20));
        ctx.restore();
    }

    // ── HUD: corações + rúpias (fixos na tela, fora da câmera) ────────
    if(!gameOver){ drawHearts(); drawRupeeHud(); }
}
</script>
</body>
</html>
